  <label class="ms-f"><span>${_t('รหัสผ่านเดิม','Current password')}</span><input class="bcs-in au-w" name="old" type="password" autocomplete="current-password" required></label>
  <label class="ms-f"><span>${_t('รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)','New password (6+ chars)')}</span><input class="bcs-in au-w" name="pw" type="password" autocomplete="new-password" minlength="6" required></label>
  <label class="ms-f"><span>${_t('ยืนยันรหัสผ่านใหม่','Confirm new password')}</span><input class="bcs-in au-w" name="pw2" type="password" autocomplete="new-password" minlength="6" required></label>
  <div class="au-row"><button class="bcs-btn bcs-pri" type="submit">${_t('เปลี่ยนรหัสผ่าน','Change password')}</button><span class="au-msg" role="status"></span></div></form>`}
async function pwSubmit(f){const msg=f.querySelector('.au-msg'),set=(t,ok)=>{msg.textContent=t;msg.style.color=ok?'#22C55E':'#EF4444'};
  if(f.pw.value!==f.pw2.value){set(_t('รหัสผ่านใหม่ไม่ตรงกัน','Passwords do not match'));return}
  try{set(_t('กำลังบันทึก…','Saving…'),true);const j=await api('passwd',{old:f.old.value,password:f.pw.value});const s=sess();if(s){if(j.token)s.token=j.token;s.user=j.user;LS.set(SKEY,s)}f.reset();set(_t('✅ เปลี่ยนรหัสผ่านแล้ว','✅ Password changed'),true)}
  catch(e){set('❌ '+e.message)}}

/* ── account summary (who am I / what can I do) ── */
function accChips(access){const a=String(access||'').split(/[,\s]+/).filter(String);if(!a.length)return`<span class="au-chip au-warn">${_t('ยังไม่กำหนดอาคาร','No building assigned')}</span>`;
  return a.map(x=>{if(x==='*')return`<span class="au-chip">🌐 ${_t('ทุกธุรกิจ · ทุกอาคาร','All businesses · all buildings')}</span>`;const p=x.split(':'),b=BIZ[p[0]];return`<span class="au-chip">${b?b.ic+' '+b.en:esc(p[0])}${p[1]==='*'?' · '+_t('ทุกอาคาร','all buildings'):' · <b>'+esc(p[1])+'</b>'}</span>`}).join('')}
function svcChips(s){s=String(s||'*');if(s==='*'||!s)return`<span class="au-chip">${_t('ทุก Module','All modules')}</span>`;return s.split(',').filter(k=>SVC[k]).map(k=>`<span class="au-chip" style="--cc:${SVC[k].c}">${SVC[k].ic} ${SVC[k].n}</span>`).join('')}
const roleBadge=r=>`<span class="au-role" style="--rc:${RCOL[r]||'#8B949E'}">${esc(roleTx(r))}</span>`;
function myAccountHTML(){const u=me();if(!u)return'';const on=authOnline();
  return`<div class="au-me"><div class="au-av" style="--rc:${RCOL[u.role]}">${esc(ini(u.name||u.username))}</div><div style="min-width:0;flex:1"><div class="au-nm">${esc(u.name||u.username)}</div><div class="bcs-muted">@${esc(u.username)} · ${on?'☁ Google Sheets':_t('โหมดสาธิต (ในเครื่อง)','Demo mode (this device)')}</div></div>${roleBadge(u.role)}</div>
  <div class="au-kv"><span>${_t('สิทธิ์','Can')}</span><div>${esc(_t(RDESC[u.role][0],RDESC[u.role][1]))}</div><span>${_t('อาคาร','Buildings')}</span><div class="au-chips">${accChips(u.role==='admin'?'*':u.access)}</div><span>Module</span><div class="au-chips">${svcChips(u.services)}</div></div>`}

/* ═════════ user management (Admin / FM) ═════════ */
const USR={list:null,sites:[],q:'',fr:'',fs:'',err:'',loading:false,rej:null,ed:null};
function usrMount(){USR.list=null;usrLoad()}
async function usrLoad(){USR.loading=true;USR.err='';usrRender();try{const j=await api('users');USR.list=j.users||[];USR.sites=j.sites||[]}catch(e){USR.err=e.message;if(e.auth)authExpired(e.message)}USR.loading=false;usrRender()}
function usrRoot(){return document.getElementById('usr-root')}
function usrRender(){const el=usrRoot();if(el)el.innerHTML=usrBody()}
function usrBody(){const m=me();if(!m||!cap('usr'))return`<div class="rm-empty">${_t('เฉพาะ Admin / FM','Admin / FM only')}</div>`;
  if(USR.err)return`<div class="au-err">❌ ${esc(USR.err)}</div><button class="bcs-btn" onclick="usrLoad()">⟳ ${_t('ลองใหม่','Retry')}</button>`;
  if(!USR.list)return`<div class="rm-empty">⏳ ${_t('กำลังโหลดรายชื่อผู้ใช้…','Loading users…')}</div>`;
  const L=USR.list,cnt=s=>L.filter(u=>u.status===s).length,pend=L.filter(u=>u.status==='pending');
  const q=USR.q.toLowerCase().trim();let rows=L.filter(u=>u.status!=='pending'||USR.fs==='pending');
  if(USR.fr)rows=rows.filter(u=>u.role===USR.fr);if(USR.fs)rows=rows.filter(u=>u.status===USR.fs);if(q)rows=rows.filter(u=>[u.username,u.name,u.email,u.phone,u.access].join(' ').toLowerCase().includes(q));
  const order=['admin','fm','sup','tech','client','requester'];rows.sort((a,b)=>order.indexOf(a.role)-order.indexOf(b.role)||String(a.name).localeCompare(String(b.name)));
  const stat=(l,v,c,f)=>`<button class="au-stat ${USR.fs===f?'on':''}" style="--sc:${c}" onclick="USR.fs=USR.fs==='${f}'?'':'${f}';usrRender()"><b>${v}</b><span>${l}</span></button>`;
  return`<div class="au-stats">${stat(_t('ใช้งาน','Active'),cnt('active'),'#22C55E','active')}${stat(_t('รออนุมัติ','Pending'),pend.length,'#EAB308','pending')}${stat(_t('ระงับ','Disabled'),cnt('disabled'),'#8B949E','disabled')}${stat(_t('ปฏิเสธ','Rejected'),cnt('rejected'),'#EF4444','rejected')}</div>
  <div class="au-note">${authOnline()?_t('☁ บัญชีเก็บใน Google Sheets › PSD_IFM_Registry › Users · รหัสผ่านเข้ารหัส SHA-256 + salt · ระบบตรวจสิทธิ์อาคาร / Module ทุกครั้งที่ซิงค์','☁ Accounts are stored in Google Sheets (Registry › Users) · salted SHA-256 passwords · building / module rights are checked on every sync')
    :_t('🧪 โหมดสาธิต — บัญชีเก็บในเบราว์เซอร์นี้เท่านั้น · เชื่อม Google Sheets เพื่อใช้งานจริงหลายเครื่อง','🧪 Demo mode — accounts live in this browser only · connect Google Sheets for real multi-user use')}${m.role==='fm'?' · '+_t('FM จัดการได้เฉพาะ หัวหน้างาน / ช่าง / ลูกค้า / ผู้แจ้งงาน ในอาคารของตน','FM manages lower roles in own buildings'):''}</div>
  ${pend.length&&USR.fs!=='pending'?`<div class="au-pend"><div class="au-ph">⏳ ${_t('รออนุมัติ','Waiting for approval')} <span class="au-cnt">${pend.length}</span></div>${pend.map(u=>`<div class="au-prow"><div style="min-width:0;flex:1"><b>${esc(u.name)}</b> <span class="bcs-muted">@${esc(u.username)}${u.email?' · '+esc(u.email):''}${u.phone?' · '+esc(u.phone):''}</span><div class="au-chips" style="margin-top:4px">${roleBadge(u.role)}${accChips(u.access)}</div>${u.note?`<div class="bcs-muted" style="margin-top:3px">“${esc(u.note)}”</div>`:''}<div class="bcs-muted">${_t('สมัครเมื่อ ','Signed up ')}${esc(String(u.created).slice(0,16).replace('T',' '))}</div></div>
    <div class="au-acts"><button class="bcs-btn bcs-pri" onclick="usrEdit('${esc(u.username)}',true)">✓ ${_t('ตรวจสิทธิ์ + อนุมัติ','Review & approve')}</button><button class="bcs-btn bcs-danger" onclick="usrReject('${esc(u.username)}',this)">✕ ${_t('ปฏิเสธ','Reject')}</button></div></div>`).join('')}</div>`:''}
  <div class="au-bar"><input class="bcs-in au-w" style="flex:1;min-width:160px" placeholder="${_t('ค้นหาชื่อ / username / อีเมล / อาคาร…','Search name / username / email / building…')}" value="${esc(USR.q)}" oninput="USR.q=this.value;usrRender();const i=usrRoot().querySelector('.au-bar input');i.focus();i.setSelectionRange(i.value.length,i.value.length)">
    <select class="bcs-in" style="width:auto" onchange="USR.fr=this.value;usrRender()"><option value="">${_t('ทุกบทบาท','All roles')}</option>${order.map(r=>`<option value="${r}" ${USR.fr===r?'selected':''}>${esc(roleTx(r))}</option>`).join('')}</select>
    <button class="bcs-btn bcs-pri" onclick="usrEdit(null)">＋ ${_t('เพิ่มผู้ใช้','Add user')}</button><button class="bcs-btn" onclick="usrLoad()" title="${_t('โหลดใหม่','Reload')}">⟳</button></div>
  <div class="au-list">${rows.length?rows.map(u=>{const self=u.username===m.username,mg=!self&&canManageU(m,u)||(self&&m.role==='admin');
    return`<div class="au-urow ${u.status!=='active'?'off':''}"><div class="au-av sm" style="--rc:${RCOL[u.role]}">${esc(ini(u.name||u.username))}</div>
      <div class="au-uc"><div><b>${esc(u.name)}</b>${self?` <span class="au-chip">${_t('คุณ','You')}</span>`:''} <span class="bcs-muted">@${esc(u.username)}</span></div><div class="bcs-muted">${u.email?'':`<span class="au-chip au-warn" title="${_t('ตั้งรหัสผ่านใหม่ทางอีเมลไม่ได้ — กด แก้ไข เพื่อเพิ่มอีเมล','Cannot reset password by email')}">⚠ ${_t('ไม่มีอีเมล','No email')}</span> `}${[u.email,u.phone].filter(Boolean).map(esc).join(' · ')}</div></div>
      <div class="au-uc">${roleBadge(u.role)}<div class="bcs-muted" style="margin-top:3px">${u.status==='active'?'● '+_t('ใช้งาน','Active'):u.status==='pending'?'⏳ '+_t('รออนุมัติ','Pending'):u.status==='disabled'?'⏸ '+_t('ระงับ','Disabled'):'✕ '+_t('ปฏิเสธ','Rejected')}</div></div>
      <div class="au-uc au-chips">${accChips(u.role==='admin'?'*':u.access)}</div>
      <div class="au-uc au-chips">${svcChips(u.services)}</div>
      <div class="au-uc bcs-muted">${u.lastLogin?_t('เข้าล่าสุด ','Last login ')+esc(String(u.lastLogin).slice(0,16).replace('T',' ')):_t('ยังไม่เคยเข้า','Never signed in')}</div>
      <div class="au-acts">${mg?`<button class="bcs-btn" onclick="usrEdit('${esc(u.username)}')">✎ ${_t('แก้ไข','Edit')}</button>`:''}${mg&&!self?`<button class="bcs-btn bcs-danger" title="${_t('ลบ','Delete')}" onclick="usrDel('${esc(u.username)}',this)">🗑</button>`:''}</div></div>`}).join(''):`<div class="rm-empty">${_t('ไม่พบผู้ใช้','No users found')}</div>`}</div>
  <details class="au-matrix"><summary>${_t('ตารางสิทธิ์ตามบทบาท','Role permissions')}</summary><table class="rm-t"><thead><tr><th>${_t('บทบาท','Role')}</th><th>${_t('ดูข้อมูล','View')}</th><th>${_t('แจ้งงาน','Raise WR')}</th><th>${_t('เพิ่ม / แก้ไข','Add / edit')}</th><th>${_t('ลบ','Delete')}</th><th>${_t('ตั้งค่า Module / KPI','Settings')}</th><th>${_t('จัดการผู้ใช้','Users')}</th><th>${_t('สร้างอาคาร / Sheets','Buildings')}</th></tr></thead>
    <tbody>${order.map(r=>{const c=RCAP[r],y='✓',n='—',sv=r==='sup'||r==='tech'?' ¹':'';return`<tr><td>${roleBadge(r)}</td><td>${y}</td><td>${y}</td><td>${c.e?y+sv:n}</td><td>${c.d?y+sv:n}</td><td>${c.set?y:n}</td><td>${c.usr?(r==='fm'?y+' ²':y):n}</td><td>${c.gas?y:n}</td></tr>`}).join('')}</tbody></table>
    <div class="bcs-muted" style="margin-top:6px">¹ ${_t('เฉพาะ Module ที่ได้รับสิทธิ์','only in assigned modules')} · ² ${_t('เฉพาะบทบาทที่ต่ำกว่า ภายในอาคารของตน','lower roles in own buildings only')} · ${_t('ทุกบทบาทเห็นเฉพาะธุรกิจ / อาคารที่ได้รับสิทธิ์','everyone sees only assigned businesses / buildings')}</div></details>`}
async function usrReject(un,btn){if(USR.rej!==un){USR.rej=un;btn.textContent=_t('กดอีกครั้งเพื่อปฏิเสธ','Tap again to reject');setTimeout(()=>{if(USR.rej===un){USR.rej=null;if(btn.isConnected)btn.textContent='✕ '+_t('ปฏิเสธ','Reject')}},3500);return}
  USR.rej=null;try{await api('userSave',{user:{username:un,status:'rejected'}});AUTH.host.toast&&AUTH.host.toast(_t('ปฏิเสธ ','Rejected ')+un);usrLoad()}catch(e){AUTH.host.toast&&AUTH.host.toast('❌ '+e.message)}}
async function usrDel(un,btn){if(USR.rej!=='del:'+un){USR.rej='del:'+un;btn.textContent=_t('ยืนยันลบ','Confirm');setTimeout(()=>{if(USR.rej==='del:'+un){USR.rej=null;if(btn.isConnected)btn.textContent='🗑'}},3500);return}
  USR.rej=null;try{await api('userDelete',{username:un});AUTH.host.toast&&AUTH.host.toast(_t('ลบผู้ใช้ ','Deleted ')+un);usrLoad()}catch(e){AUTH.host.toast&&AUTH.host.toast('❌ '+e.message)}}

/* editor */
function usrEdit(un,approve){const m=me(),u=un?(USR.list||[]).find(x=>x.username===un):null;
  const acc={all:false,biz:{}};Object.keys(BIZ).forEach(b=>acc.biz[b]={on:false,all:true,sites:[]});
  String(u?u.access:'').split(/[,\s]+/).filter(String).forEach(x=>{if(x==='*'){acc.all=true;return}const p=x.split(':');if(!acc.biz[p[0]])return;const o=acc.biz[p[0]];o.on=true;if(p[1]==='*')o.star=true;else o.sites.push(p[1])});
  Object.values(acc.biz).forEach(o=>{o.all=!!o.star||!o.sites.length;delete o.star});
  if(!u&&m.role!=='admin'){const b=BIZK;if(acc.biz[b]&&bizAllowed(b)){acc.biz[b].on=true;const fmAll=accOf(m).includes('*')||accOf(m).includes(b+':*');if(!fmAll){acc.biz[b].all=false;acc.biz[b].sites=accOf(m).filter(x=>x.startsWith(b+':')).map(x=>x.split(':')[1]).slice(0,1)}}}
  const sv=String(u?u.services||'*':'*');
  USR.ed={isNew:!u,self:!!u&&u.username===m.username,username:u?u.username:'',name:u?u.name:'',email:u?u.email:'',phone:u?u.phone:'',note:u?u.note:'',role:u?u.role:(m.role==='admin'?'tech':'tech'),
    status:approve?'active':(u?u.status:'active'),acc,svcAll:sv==='*',svcs:sv==='*'?[]:sv.split(','),pw:'',genPw:'',err:'',approve:!!approve};
  usrEdRender()}
function usrEdClose(){const e=document.getElementById('usr-ed');if(e){e.hidden=true;e.innerHTML=''}USR.ed=null}
function usrEdRender(){const E=USR.ed;if(!E)return;let el=document.getElementById('usr-ed');if(!el){el=document.createElement('div');el.id='usr-ed';el.className='bcs-modal';el.addEventListener('click',ev=>{if(ev.target===el)usrEdClose()});document.body.appendChild(el)}
  const m=me(),isAdm=m.role==='admin',roles=isAdm?Object.keys(RL):['sup','tech','client','requester'];const rOpts=roles.includes(E.role)?roles:roles.concat([E.role]);
  const bizList=isAdm?Object.keys(BIZ):BIZ_OK(),coverAll=b=>isAdm||accOf(m).includes('*')||accOf(m).includes(b+':*');
  const sitesOf=b=>{const s=new Set(USR.sites.filter(x=>x.business===b).map(x=>x.site));E.acc.biz[b].sites.forEach(x=>s.add(x));if(!isAdm&&!coverAll(b))[...s].forEach(x=>{if(!hasAcc(m,b,x))s.delete(x)});return [...s]};
  const inp=(k,l,ty,ph,dis)=>`<label class="ms-f"><span>${l}</span><input class="bcs-in au-w" ${ty?`type="${ty}"`:''} value="${esc(E[k]||'')}" placeholder="${esc(ph||'')}" ${dis?'disabled':''} oninput="USR.ed.${k}=this.value"></label>`;
  const adminRole=E.role==='admin';
  el.innerHTML=`<div class="bcs-mbox" style="width:780px"><div class="bcs-mh"><div><div class="bcs-muted">${E.approve?_t('อนุมัติผู้ลงทะเบียน','Approve sign-up'):E.isNew?_t('ผู้ใช้ใหม่','New user'):_t('แก้ไขผู้ใช้','Edit user')}</div><div class="bcs-st" style="font-size:20px">👤 ${esc(E.isNew?_t('เพิ่มผู้ใช้งาน','Add user'):E.name||E.username)}</div></div><button class="bcs-btn" onclick="usrEdClose()">✕</button></div>
   <div class="ms-grid">${inp('username','Username *','', 'เช่น somchai.k',!E.isNew)}${inp('name',_t('ชื่อ-นามสกุล *','Full name *'))}${inp('email',_t('อีเมล * (รับรหัสเมื่อลืมรหัสผ่าน)','Email * (password reset)'),'email')}${inp('phone',_t('โทรศัพท์','Phone'),'tel')}</div>
   <div class="ms-grid">
    <label class="ms-f"><span>${_t('บทบาท','Role')}</span><select class="bcs-in au-w" ${E.self?'disabled':''} onchange="USR.ed.role=this.value;usrEdRender()">${rOpts.map(r=>`<option value="${r}" ${E.role===r?'selected':''}>${esc(roleTx(r))}</option>`).join('')}</select><small>${esc(_t(RDESC[E.role][0],RDESC[E.role][1]))}</small></label>
    <label class="ms-f"><span>${_t('สถานะ','Status')}</span><select class="bcs-in au-w" ${E.self?'disabled':''} onchange="USR.ed.status=this.value">${[['active',_t('ใช้งาน','Active')],['pending',_t('รออนุมัติ','Pending')],['disabled',_t('ระงับชั่วคราว','Disabled')],['rejected',_t('ปฏิเสธ','Rejected')]].map(s=>`<option value="${s[0]}" ${E.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select></label>
    <label class="ms-f"><span>${E.isNew?_t('รหัสผ่าน *','Password *'):_t('ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)','New password (blank = keep)')}</span><span class="au-row"><input class="bcs-in au-w" id="usr-pw" type="text" autocomplete="off" value="${esc(E.pw)}" oninput="USR.ed.pw=this.value" style="flex:1"><button type="button" class="bcs-btn" onclick="USR.ed.pw=randPw();usrEdRender()">🎲 ${_t('สุ่ม','Generate')}</button></span><small>${_t('ส่งรหัสให้ผู้ใช้ แล้วให้เปลี่ยนเองที่ ตั้งค่า › บัญชีของฉัน','Send it to the user; they can change it in Settings › My account')}</small></label>
   </div>
   <div class="au-sec"><b>🏢 ${_t('สิทธิ์ธุรกิจ / อาคาร','Business / building access')}</b><small>${adminRole?_t('Admin เข้าถึงทุกธุรกิจ ทุกอาคารโดยอัตโนมัติ','Admin always has access to everything'):_t('เลือกธุรกิจ แล้วเลือก “ทุกอาคาร” หรือ “เฉพาะอาคาร”','Pick businesses, then all buildings or specific ones')}</small></div>
   ${adminRole?'':`${isAdm||accOf(m).includes('*')?`<label class="au-ck"><input type="checkbox" ${E.acc.all?'checked':''} onchange="USR.ed.acc.all=this.checked;usrEdRender()"> 🌐 <b>${_t('ทุกธุรกิจ · ทุกอาคาร','All businesses · all buildings')}</b></label>`:''}

   <button class="md-opt ${m==='live'?'on':''}" style="--mc:#22C55E" onclick="setDataMode('live')"><b>✅ ข้อมูลจริง</b><small>${site?'อาคาร <b>'+esc(site)+'</b> · ซิงค์ Google Sheets ทุกเครื่อง':on?'<span class="md-warn">⚠ ยังไม่ได้เลือกอาคาร</span> — ตั้งรหัสอาคารใน ☁ Google Sheets ก่อน ข้อมูลยังอยู่ในเครื่องนี้':'ยังไม่เชื่อม Google Sheets — เก็บในเครื่องนี้'} · ใช้งานจริงกับลูกค้า</small>${m==='live'?'<i>กำลังใช้</i>':''}</button></div>
  ${m==='sample'?`<div class="au-row" style="margin-top:10px"><button class="bcs-btn" onclick="sampleReset(this)">🔄 รีเซ็ตข้อมูลตัวอย่าง</button><span class="bcs-muted">สร้างชุดตัวอย่างของ ${P().en} ใหม่ทั้งหมด (ไม่กระทบข้อมูลจริง)</span></div>`
  :`<div class="md-live"><b>🧹 เริ่มอาคารจริง</b><span class="bcs-muted">ล้างงานตัวอย่าง / งานทดลองของ${site?' '+esc(site):'อาคารนี้'} — Work Request, Log Sheet, ผลทดสอบ, ตรวจ, Patrol, เหตุการณ์, ผู้มาติดต่อ, เบิกผ้า, มิเตอร์, พนักงาน, ผู้รับเหมา, สัญญา MA และข้อมูลอาคาร & สัญญา ${on&&site?'แล้วเขียนทับ Google Sheet ของอาคารนี้':''}</span>${st?`<span class="au-chip" style="--cc:#22C55E">✓ เริ่มอาคารจริงแล้ว (${st==='structure'?'เก็บโครงสร้าง':'ว่างทั้งหมด'})</span>`:''}
    <div class="au-row"><button class="bcs-btn bcs-pri" onclick="liveStart(this,true)">เริ่มแบบเก็บโครงสร้าง</button><span class="bcs-muted">เก็บพื้นที่ · ทรัพย์สิน · อุปกรณ์หลัก · รายการทดสอบ · Compliance · แผน PM · งาน HK · จุด Pest · โซนสวน · รายการผ้า ไว้แก้ต่อ</span></div>
    <div class="au-row"><button class="bcs-btn" onclick="liveStart(this,false)">เริ่มแบบว่างทั้งหมด</button><span class="bcs-muted">เหลือเฉพาะพื้นที่ (Area) และการตั้งค่า — กรอกทะเบียนทั้งหมดเอง</span></div></div>`}`}

/* ---------- mobile host for Part 2 ---------- */
MSET.host={toast:m=>toast(m),after:()=>render(),user:()=>ST.user?ST.user.name:''};
SYNC.onMerge=()=>{if(!FM)render()};
SYNC.blockRefresh=()=>!!FM||!!(document.getElementById('si-m')&&!document.getElementById('si-m').hidden)||!!(document.getElementById('omlog')&&!document.getElementById('omlog').hidden)||!!(document.getElementById('mset')&&!document.getElementById('mset').hidden);
SYNC.onStatus=()=>{const e=document.getElementById('m-sync');if(e)e.innerHTML=mSyncText()};
function mSyncText(){if(DMODE()==='sample')return'🧪 '+tx('ข้อมูลตัวอย่าง — ไม่ซิงค์','Sample data — not synced');const st=SYNC.status,c={ok:'var(--green)',err:'var(--red)',busy:'var(--yellow)'}[st]||'var(--color-neutral-500)';
  const t=!gasReady()?tx('ยังไม่ได้เชื่อม Google Sheets — ข้อมูลอยู่ในเครื่องนี้','Not connected to Google Sheets — data stays on this device'):st==='busy'?tx('กำลังซิงค์…','Syncing…'):st==='err'?SYNC.msg:SYNC.last?tx('ซิงค์ล่าสุด ','Last sync ')+SYNC.last.toLocaleTimeString('th-TH'):tx('เชื่อมต่อแล้ว','Connected');
  return '<span class="sync-dot" style="background:'+c+'"></span>'+esc(t)}
function metricGoM(svc,tab){const M=MOD(svc),want={eng:{pm:'pm',wr:'wr',om:'equip'},fac:{pm:'pm',wr:'wr',om:'wr'}}[svc]||{};const k=want[tab]||'wr';if(M.subs.some(s=>s.k===k))ST.sub[svc]=k;ST.q='';render();setTimeout(()=>{const c=document.querySelector('.chips .chip.active');c&&c.scrollIntoView({behavior:'smooth',block:'center',inline:'center'})},60)}
function omTestDoneM(id){omLogOpen(null,id)}
function maVisitM(id){const r=D.maContract.find(x=>x.id===id);if(!r)return;r.visitsDone=(+r.visitsDone||0)+1;save();render();toast(r.service+' +1')}
Object.assign(CARD,{
  omEquip:r=>({t:r.asset,m:r.system+' · '+r.area+(r.rated?' · '+r.rated:'')+' · Run '+fmtN(r.runHours)+' h',b:badge(r.status),x:tx('ตรวจล่าสุด ','Last check ')+fmtD(r.lastCheck)+' · '+(r.operator||'')}),
  omTest:r=>({t:r.test,m:(r.equipment||'')+' · '+r.freq+' · '+(r.by||''),b:badge(r.result)+' '+badge(r.status),x:tx('ครบกำหนด ','Due ')+fmtD(r._nextDue),a:'<button class="btn btn-ok btn-sm" onclick="event.stopPropagation();omTestDoneM(\''+r.id+'\')">🧪 '+tx('บันทึกผลทดสอบ','Record test')+'</button><button class="btn btn-sm" onclick="event.stopPropagation();omTestHist(\''+r.id+'\')">📚 '+tx('ประวัติ','History')+' ('+omTestLogs(r.id).length+')</button>'}),
  omLog:r=>'<div class="blueprint tap rec" role="button" tabindex="0" onclick="omLogView(\''+r.id+'\')"><div class="top"><span class="tag-id">'+esc(r.id)+'</span>'+badge(r.status)+'<span class="m" style="margin-left:auto">'+fmtDT(r.dt)+'</span></div><div class="t">'+esc(r.equipment)+'</div><div class="m">'+omLogReadCell(r)+' · '+esc(r.shift||'')+' · '+esc(r.recorder||'')+'</div>'+((r.photos||[]).length||r.sig?'<div>'+omLogMediaCell(r)+'</div>':'')+'</div>',
  maContract:r=>{const p=r.visitsYear?Math.min(100,Math.round(r.visitsDone/r.visitsYear*100)):0;return{t:r.service+' · '+r.vendor,m:(r.equipment||'')+' · ฿'+fmtN(r.value)+tx('/ปี','/yr')+' · SLA '+r.respHr+' h',b:badge(r.status),bar:[p,r._behind?'var(--orange)':'var(--green)'],x:'PM '+r._prog+tx(' ครั้ง',' visits')+(r._behind?tx(' · ช้ากว่าแผน',' · behind plan'):'')+' · '+tx('สิ้นสุด ','Ends ')+fmtD(r.end),a:(+r.visitsDone||0)<(+r.visitsYear||0)?'<button class="btn btn-ok btn-sm" onclick="event.stopPropagation();maVisitM(\''+r.id+'\')">+1 '+tx('เข้า PM','PM visit')+'</button>':''}}});
function mGasForm(){const c=gasCfg();return '<div class="blueprint pad" style="display:flex;flex-direction:column;gap:10px">'
  +'<div id="m-sync" style="font-size:14px">'+mSyncText()+'</div>'
  +'<div class="field"><label for="mg-url">Web App URL</label><input class="input" id="mg-url" value="'+esc(c.url)+'" placeholder="https://script.google.com/macros/s/…/exec"></div>'
  +'<div class="field"><label for="mg-key">API Key '+tx('(กุญแจหลัก · ไม่บังคับ)','(master key · optional)')+'</label><input class="input" id="mg-key" type="password" value="'+esc(c.key)+'"></div>'
  +'<div class="field"><label for="mg-site">'+tx('รหัสอาคาร (Site Code) — ','Site code — ')+esc(tx(P().n,P().en))+'</label><input class="input" id="mg-site" value="'+esc(gasSite())+'" style="text-transform:uppercase"></div>'
  +'<label class="row" style="font-size:14px"><input type="checkbox" id="mg-auto" '+(c.auto?'checked':'')+' style="width:20px;height:20px;accent-color:var(--color-accent)">'+tx('ซิงค์อัตโนมัติ','Auto sync')+'</label>'
  +'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary btn-sm" onclick="mGasSave()">'+tx('บันทึก + ซิงค์','Save + sync')+'</button><button class="btn btn-sm" onclick="mGasSyncNow()">'+tx('ซิงค์ตอนนี้','Sync now')+'</button></div>'
  +'<div style="font-size:12.5px;color:var(--color-neutral-700)">'+tx('ตั้งค่าครั้งเดียวในเดสก์ท็อปก็ได้ (เว็บไซต์เดียวกันใช้ค่าร่วมกัน) · 1 อาคาร 1 ธุรกิจ = 1 Spreadsheet','Can be set once on desktop (same site shares settings) · 1 building × 1 business = 1 spreadsheet')+'</div></div>'}
async function mGasSave(){const g=id=>document.getElementById(id);LS.set('psd_ifm_gas',{url:g('mg-url').value.trim(),key:g('mg-key').value.trim(),auto:g('mg-auto').checked});const os=gasSite();LS.set('psd_ifm_site_'+BIZK,g('mg-site').value.trim().toUpperCase().replace(/[^A-Z0-9_-]/g,''));if(gasSite()!==os)load();
  if((sess()||{}).mode!==(authOnline()?'online':'local')){authLogout(tx('เปลี่ยนการเชื่อมต่อแล้ว — กรุณาเข้าสู่ระบบด้วยบัญชีบน Google Sheets','Connection changed — please sign in again'));return}
  if(!gasReady()){toast(tx('ใส่ URL, API Key และรหัสอาคารให้ครบ','Fill in URL, API key and site code'));return}try{await gasCall('register');await authRefresh()}catch(e){toast('❌ '+e.message);return}await syncBoot(()=>render());if(SYNC.status==='ok')toast(tx('เชื่อมต่อ Google Sheets แล้ว','Connected to Google Sheets'));render()}
async function mGasSyncNow(){if(!gasReady()){toast(tx('ยังไม่ได้ตั้งค่า','Not configured'));return}await syncPush();const got=await syncPull();toast(SYNC.status==='ok'?tx('ซิงค์แล้ว','Synced'):'❌ '+SYNC.msg);if(got)render()}

/* ---------- render / boot ---------- */
function render(){const root=document.getElementById('app-root');
  if(!ST.lang)root.innerHTML=screenSplash();else if(!ST.user)root.innerHTML=screenLogin();else{root.innerHTML=screenMain();if(ST.tab==='bldg')BCS.mount()}
  document.documentElement.lang=ST.lang==='en'?'en':'th'}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
SITE.host={toast:m=>toast(m),saved:()=>{},svc:()=>{},renamed:()=>{},reload:()=>{render();if(gasReady())syncBoot(()=>{if(!FM)render()})}};
window.addEventListener('storage',e=>{if(e.key===DKEY()){load();if(!FM)render()}if(e.key===SKEY){ST.user=stUser();if(ST.user){authApply();load()}render()}});AUTH.host={toast:m=>toast(m),tx:(a,b)=>tx(a,b),client:'mobile',after:()=>{ST.user=stUser();if(!FM)render()},reload:()=>{ST.user=stUser();load();render();SYNC.last=null;syncBoot(()=>{if(!FM)render()})},
  loggedOut:m=>{typeof siteCloseM==='function'&&(document.getElementById('si-m')||{}).hidden===false&&siteCloseM();ST.user=null;LGM.msg=m||'';LGM.tab='login';USR.list=null;closeSheet();usrCloseM();typeof usrEdClose==='function'&&usrEdClose();typeof msetClose==='function'&&msetClose();typeof omLogClose==='function'&&omLogClose();render()}};

/* ── permission guards (role / building / module) ── */
const GUARD=(n,chk)=>{if(typeof window[n]==='function')window[n]=authGuard(window[n],chk)};
const rowOf=(ent,id)=>(D[ent]||[]).find(r=>r.id===id);
GUARD('delRow',(ent,id)=>canDel(ent,rowOf(ent,id)));
GUARD('markDone',(ent,id)=>canEdit(ent,rowOf(ent,id)));
GUARD('setField',(ent,id)=>canEdit(ent,rowOf(ent,id)));
GUARD('checkout',id=>canEdit('visitors',rowOf('visitors',id)));
GUARD('pestCheck',id=>canEdit('pestSt',rowOf('pestSt',id)));
GUARD('omLogOpen',id=>canEdit('omLog',id?rowOf('omLog',id):null));
['advance','advanceM','bcsAdvance'].forEach(n=>GUARD(n,id=>canEdit('tickets',rowOf('tickets',id))));
['omTestDone','omTestDoneM'].forEach(n=>GUARD(n,id=>canEdit('omTest',rowOf('omTest',id))));
['maVisit','maVisitM'].forEach(n=>GUARD(n,id=>canEdit('maContract',rowOf('maContract',id))));
['bcsSetupOpen','bcsToggleEdit','bcsPlanUpload','bcsPlanClear','bcsResetRooms'].forEach(n=>GUARD(n,()=>cap('set')));

applyPrefs();authBoot();ST.user=stUser();load();render();if(ST.user)setTimeout(()=>syncBoot(()=>{if(!FM)render()}),50);
</script>
