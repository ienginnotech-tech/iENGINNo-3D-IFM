<style>
/* Layout: phone-first single column (max 900px), bottom tab bar, bottom-sheet forms. Tokens follow the iMATOMs Mobile design system. */
:root{
  --color-bg:#f2f2f3; --color-surface:#e9e9ea; --color-card:#f7f7f8; --color-text:#1d1f20;
  --color-accent:#5980a6; --color-divider:rgba(29,31,32,.16);
  --color-neutral-100:#f5f5f8; --color-neutral-200:#e7e7ea; --color-neutral-300:#d4d4d7;
  --color-neutral-500:#98989b; --color-neutral-600:#7a7a7d; --color-neutral-700:#5d5d60; --color-neutral-800:#424244;
  --color-accent-100:#eef6ff; --color-accent-600:#597ea3; --color-accent-700:#416180; --color-accent-800:#2c455d;
  --font-heading:"Barlow Condensed","Sarabun",system-ui,sans-serif; --font-body:"Barlow","Sarabun",system-ui,sans-serif;
  --danger:#c0392b; --orange:#e69a3c; --green:#2f9e5b; --yellow:#c9970c; --sky:#5aa9e6; --red:#d0453a; --purple:#8e5bd6; --teal:#1f9c8e;
  --hard:#e2782f; --soft:#1f9c8e; --sheet-bg:#f7f7f8; --overlay:rgba(20,24,30,.45); --desk:#dfe1e4;
  color-scheme:light;
}
body.theme-dark{
  --color-bg:#0d1117; --color-surface:#161b22; --color-card:#11161d; --color-text:#e6edf3;
  --color-accent:#5b8fc4; --color-divider:rgba(230,237,243,.18);
  --color-neutral-100:#161b22; --color-neutral-200:#21262d; --color-neutral-300:#30363d;
  --color-neutral-500:#6e7681; --color-neutral-600:#8b949e; --color-neutral-700:#a0a8b3; --color-neutral-800:#c9d1d9;
  --color-accent-100:#14263a; --color-accent-600:#7aa6d4; --color-accent-700:#8fb8e3; --color-accent-800:#bcd6f0;
  --danger:#ff6b5b; --green:#4fd17a; --yellow:#eab308; --red:#ff6b5b; --purple:#b48cf0; --teal:#2fc4b2; --hard:#f08a3e; --soft:#2fc4b2;
  --sheet-bg:#161b22; --overlay:rgba(0,0,0,.65); --desk:#05080c; color-scheme:dark;
}
/* ตามระบบ on a light device → dark grey (dim), clearly different from Light */
body.theme-dark.theme-dim{
  --color-bg:#2d333b; --color-surface:#373e47; --color-card:#353c45; --color-text:#e3e9ef;
  --color-divider:rgba(227,233,239,.2);
  --color-neutral-100:#373e47; --color-neutral-200:#424a54; --color-neutral-300:#545d68;
  --color-neutral-500:#8d99a6; --color-neutral-600:#a3aebb; --color-neutral-700:#b4bfcb; --color-neutral-800:#d3dae2;
  --color-accent-100:#2c3e52; --sheet-bg:#373e47; --desk:#22272e;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--color-bg)}
body{margin:0;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body.font-sarabun{--font-heading:"Sarabun",system-ui,sans-serif;--font-body:"Sarabun",system-ui,sans-serif}
h1,h2,h3{font-family:var(--font-heading);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
button{font:inherit;color:inherit}
.tap{cursor:pointer}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
@keyframes orbitA{from{transform:rotate(20deg)}to{transform:rotate(380deg)}}
@keyframes orbitB{from{transform:rotate(-40deg)}to{transform:rotate(320deg)}}
@keyframes orbitC{from{transform:rotate(100deg)}to{transform:rotate(460deg)}}
@keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

#app-root{width:100%;max-width:900px;margin:0 auto;min-height:100vh;background:var(--color-bg);display:flex;flex-direction:column}
@media(min-width:901px){body{background:var(--desk)}#app-root{box-shadow:0 0 40px rgba(0,0,0,.08)}}

/* cards */
.blueprint{position:relative;border:1px solid var(--color-divider);border-radius:6px;background:var(--color-card);min-width:0}
.blueprint.tap{transition:transform .15s,box-shadow .15s,border-color .15s}
.blueprint.tap::after{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--bc,var(--color-accent));transform:scaleY(0);transform-origin:top;transition:transform .15s;border-radius:6px 0 0 6px}
.blueprint.tap:hover,.blueprint.tap:active{transform:translateY(-2px);box-shadow:0 10px 20px -8px rgba(0,0,0,.28);border-color:var(--bc,var(--color-accent))}
.blueprint.tap:hover::after,.blueprint.tap:active::after{transform:scaleY(1)}
.pad{padding:14px}

/* buttons / forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--font-heading);font-weight:600;font-size:16px;background:transparent;border:1px solid var(--color-divider);padding:9px 16px;border-radius:2px;white-space:nowrap}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn-ok{border-color:var(--green);color:var(--green)}
.btn-danger{border-color:var(--red);color:var(--red)}
.btn-sm{padding:5px 11px;font-size:14px}
.btn-block{width:100%}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>label{font-size:13.5px;color:var(--color-neutral-700)}
.field .req{color:var(--red)}
.input{width:100%;min-height:42px;padding:8px 10px;font:inherit;font-size:16px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider);border-radius:0}
.input:focus-visible{outline:none;border-color:var(--color-accent)}
textarea.input{min-height:84px;resize:vertical}
.seg{display:inline-flex;overflow:hidden;border:1px solid var(--color-divider);max-width:100%}
.seg-opt{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;font-size:14.5px;cursor:pointer;background:none;border:none;white-space:nowrap}
.seg-opt+.seg-opt{border-left:1px solid var(--color-divider)}
.seg-opt.active{background:var(--color-accent);color:#fff}

/* tags & badges */
.tag{display:inline-flex;align-items:center;font-size:12.5px;letter-spacing:.02em;padding:2px 9px;border-radius:2px;white-space:nowrap}
.tag-accent{background:var(--color-accent-100);color:var(--color-accent-800)}
.tag-neutral{background:var(--color-neutral-200);color:var(--color-neutral-800)}
.tag-id{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:var(--color-neutral-200);color:var(--color-neutral-800);padding:1px 7px;border-radius:2px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--bc);background:color-mix(in srgb,var(--bc) 14%,transparent)}
.b-green{--bc:var(--green)}.b-yellow{--bc:var(--yellow)}.b-red{--bc:var(--red)}.b-blue{--bc:var(--sky)}.b-orange{--bc:var(--orange)}.b-gray{--bc:var(--color-neutral-600)}.b-teal{--bc:var(--teal)}.b-purple{--bc:var(--purple)}
.svc-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:2px;white-space:nowrap;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent)}
.pill{font-family:var(--font-heading);font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700}

/* atom */
.atom{position:relative}
.atom .ring{position:absolute;left:50%;top:50%;border-radius:50%}
.atom .ring.a{border:3px solid var(--sky);animation:orbitA 14s linear infinite}
.atom .ring.b{border:3px solid #4fd17a;animation:orbitB 11s linear infinite}
.atom .ring.c{border:3px solid var(--orange);animation:orbitC 17s linear infinite}
.atom .nucleus{position:absolute;left:50%;top:50%;background:#f0862f;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 16px 4px rgba(240,134,47,.7)}

/* hero */
.hero{flex-shrink:0;padding:calc(30px + env(safe-area-inset-top)) 16px 22px;position:relative;overflow:hidden;text-align:center;background:radial-gradient(circle at 50% 35%,#1c3a5e 0%,#0d1b30 70%,#0a1526 100%);color:#fff}
.hero .kicker{font-family:var(--font-heading);font-size:15px;letter-spacing:.2em;color:var(--orange);margin-top:8px}
.hero .title{font-family:var(--font-heading);font-size:28px;font-weight:600;margin-top:2px;letter-spacing:.02em}
.hero .title .v{color:#e6672f}
.hero .sub{font-family:var(--font-heading);font-size:13px;letter-spacing:.12em;color:#4fd17a;margin-top:4px}

/* top bar + tab bar */
.topbar{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));flex-shrink:0;border-bottom:1px solid var(--color-divider);position:sticky;top:0;background:var(--color-bg);z-index:20}
.topbar .brand{font-family:var(--font-heading);font-weight:700;font-size:18px;line-height:1.05}
.topbar .brand small{display:block;font-weight:500;font-size:11.5px;letter-spacing:.1em;color:var(--color-accent-700);text-transform:uppercase}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--color-accent);color:#fff;display:grid;place-items:center;font-family:var(--font-heading);font-weight:700;flex-shrink:0;border:none;cursor:pointer}
.biz-chip{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:13px;border:1px solid var(--color-divider);padding:4px 9px;border-radius:2px;background:none;cursor:pointer;max-width:48vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.view-body{flex:1;padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
.stack{display:flex;flex-direction:column;gap:14px}
.tabbar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--color-divider);flex-shrink:0;padding:8px max(4px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(4px,env(safe-area-inset-left));background:var(--color-bg);z-index:20}
.tabitem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;color:var(--color-neutral-600);background:none;border:none;padding:6px 2px;border-radius:6px;position:relative}
.tabitem.active{color:var(--color-accent-700)}
.tabitem::before{content:'';position:absolute;left:14%;right:14%;top:-9px;height:3px;background:var(--color-accent);transform:scaleX(0);transition:transform .15s}
.tabitem.active::before{transform:scaleX(1)}
.tabitem svg{width:23px;height:23px}
.tabitem span{font-size:13.5px;line-height:1.1;font-family:var(--font-heading);white-space:nowrap}
.tabitem .fab{width:48px;height:48px;margin-top:-22px;border-radius:50%;background:var(--color-accent);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px -6px rgba(0,0,0,.4)}
.tabitem .fab svg{width:26px;height:26px}
.tabitem .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--red);color:#fff;font-size:10px;font-weight:700;border-radius:9px;padding:0 5px;line-height:16px;min-width:16px;text-align:center}

/* content pieces */
.sec-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-t h2{font-size:21px}
.sec-t small{font-size:13px;color:var(--color-neutral-700)}
.kick{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)}
.stat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:11px 12px;border-top:3px solid var(--sc,var(--color-accent))}
.stat .v{font-family:var(--font-heading);font-size:28px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.stat .v small{font-size:15px;margin-left:1px}
.stat .s{font-size:12.5px;color:var(--color-neutral-700);line-height:1.3}
.bar{height:5px;background:var(--color-neutral-300);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
.row{display:flex;align-items:center;gap:12px}
.svc-row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.svc-ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-size:20px;flex-shrink:0;background:color-mix(in srgb,var(--sc) 15%,transparent)}
.svc-row .n{font-family:var(--font-heading);font-size:18px;font-weight:600;line-height:1.1}
.svc-row .th{font-size:12.5px;color:var(--color-neutral-700);line-height:1.25}
.svc-row .sc{font-family:var(--font-heading);font-size:24px;font-weight:600;text-align:right;line-height:1;font-variant-numeric:tabular-nums}
.svc-row .sc small{display:block;font-family:var(--font-body);font-size:11.5px;color:var(--color-neutral-700);font-weight:400;margin-top:3px}
.list{display:flex;flex-direction:column;gap:10px}
.rec{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.rec .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rec .t{font-weight:600;font-size:15.5px;line-height:1.35}
.rec .m{font-size:13px;color:var(--color-neutral-700);line-height:1.35}
.rec .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.alert-row{padding:10px 12px;border-left:4px solid var(--ac);display:flex;flex-direction:column;gap:2px}
.alert-row .m{font-size:14px;line-height:1.35}
.alert-row .s{font-size:12.5px;color:var(--color-neutral-700)}
.note{padding:10px 12px;font-size:13.5px;color:var(--color-neutral-800);background:var(--color-accent-100);border:1px solid var(--color-divider);border-radius:6px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;border:1px solid var(--color-divider);padding:6px 12px;font-size:14px;border-radius:20px;background:none;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--color-accent);border-color:var(--color-accent);color:#fff}
.mod-head{display:flex;align-items:center;gap:12px}
.back{background:none;border:none;color:var(--color-accent-700);font-size:15px;cursor:pointer;padding:4px 0}
.empty{padding:26px 14px;text-align:center;color:var(--color-neutral-700);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--color-neutral-700)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--color-divider);margin-left:6px;padding-left:14px}
.timeline div{position:relative;padding:4px 0;font-size:13.5px}
.timeline div::before{content:'';position:absolute;left:-20px;top:10px;width:10px;height:10px;border-radius:50%;background:var(--tc,var(--color-neutral-300))}
.search{width:100%;min-height:40px;padding:8px 12px;font:inherit;font-size:15px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-divider)}
.footer-legal{text-align:center;padding-top:10px;border-top:1px solid var(--color-divider);margin-top:8px}
.footer-legal .l1{font-family:var(--font-heading);font-size:12px;letter-spacing:.1em}
.footer-legal .l2{font-size:11px;line-height:1.35;color:var(--color-accent-700);margin-top:6px}
.footer-legal .l3{font-size:11px;color:var(--color-accent-700);margin-top:3px}
.link{color:var(--color-accent-700);font-size:14px;text-align:center;display:block;cursor:pointer;background:none;border:none;width:100%;padding:8px}
.pref-opt{cursor:pointer;border:2px solid var(--color-divider);padding:10px 8px;text-align:center;flex:1;min-width:0;background:none;font-size:14px}
.pref-opt.active{border-color:var(--color-accent);background:var(--color-accent-100)}
.biz-opt{display:flex;align-items:center;gap:12px;padding:11px 12px;text-align:left;width:100%}
.biz-opt .i{font-size:24px}
.biz-opt.on{border-color:var(--color-accent);--bc:var(--color-accent)}

/* bottom sheet */
.sheet-ov{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet-bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;padding:8px max(18px,env(safe-area-inset-right)) calc(22px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));animation:sheetUp .2s ease}
.sheet .grip{width:42px;height:4px;border-radius:2px;background:var(--color-neutral-300);margin:4px auto 10px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.sheet-h h3{font-size:21px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid .full{grid-column:1/-1}
.ferr{color:var(--red);font-size:13.5px;min-height:18px;margin:6px 0}
@media(max-width:440px){.form-grid{grid-template-columns:1fr}}


body{--bcs-card:var(--color-card);--bcs-card2:var(--color-surface);--bcs-line:var(--color-divider);--bcs-text:var(--color-text);--bcs-muted:var(--color-neutral-700);--bcs-acc:var(--color-accent);--bcs-r:6px;--bcs-display:var(--font-heading)}
/*@@BCSCSS-START@@*/
/* ── Building Critical Status (shared) — host maps --bcs-* tokens ── */
.bcs{display:flex;flex-direction:column;gap:14px;color:var(--bcs-text)}
.bcs [hidden]{display:none!important}
.bcs-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.bcs-kpi{background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:var(--bcs-r);padding:11px 13px;border-top:3px solid var(--kc);display:flex;flex-direction:column;gap:2px;transition:transform .15s,box-shadow .15s}
.bcs-kpi:hover{transform:translateY(-3px);box-shadow:0 10px 20px -8px rgba(0,0,0,.35)}
.bcs-kpi span{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--bcs-muted);font-weight:600}
.bcs-kpi b{font-family:var(--bcs-display);font-size:26px;line-height:1.05;color:var(--kc);font-variant-numeric:tabular-nums}
.bcs-kpi small{font-size:11.5px;color:var(--bcs-muted)}
.bcs-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bcs-chips{display:flex;gap:6px;overflow-x:auto;flex:1 1 320px;min-width:0;padding:2px 0 4px;scrollbar-width:thin}
.bcs-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;border:1px solid var(--bcs-line);background:var(--bcs-card);color:var(--bcs-text);font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s,border-color .15s}
.bcs-chip i{width:9px;height:9px;border-radius:50%;background:var(--fc)}
.bcs-chip small{background:var(--fc);color:#fff;border-radius:9px;padding:0 6px;font-size:10.5px}
.bcs-chip:hover{transform:translateY(-2px);border-color:var(--fc)}
.bcs-chip.on{border-color:var(--bcs-acc);background:color-mix(in srgb,var(--bcs-acc) 14%,var(--bcs-card))}
.bcs-tools{display:flex;gap:6px;flex-wrap:wrap}
.bcs-btn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:6px;border:1px solid var(--bcs-line);background:transparent;color:var(--bcs-text);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.bcs-btn:hover{background:var(--bcs-card2)}
.bcs-btn.on{background:var(--bcs-acc);border-color:var(--bcs-acc);color:#fff}
.bcs-pri{background:var(--bcs-acc);border-color:var(--bcs-acc);color:#fff}
.bcs-ok{border-color:#22C55E;color:#22C55E;padding:2px 8px;font-size:11.5px}
.bcs-danger{border-color:#EF4444;color:#EF4444}
.bcs-layout{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.bcs-bwrap{flex:0 0 470px;max-width:100%;background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:var(--bcs-r);padding:12px;position:relative;min-width:0}
.bcs-bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.bcs-cap{font-size:11px;font-weight:700;color:var(--bcs-muted);letter-spacing:.8px;text-transform:uppercase}
.bcs-modes{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.bcs-dots{font-size:10.5px;color:var(--bcs-muted);margin-right:4px}
.bcs-dots i{font-style:normal;margin-left:4px}
.bcs-mb{padding:2px 8px;border-radius:5px;border:1px solid var(--bcs-line);background:transparent;color:var(--bcs-muted);font-size:11px;font-weight:700;cursor:pointer;font-family:inherit}
.bcs-mb.on{background:#F97316;border-color:#F97316;color:#fff}
.bcs-3d{position:relative;width:100%;border-radius:8px;overflow:hidden;cursor:grab;background:radial-gradient(ellipse at 50% 30%,#1b2a3a 0%,#0d1117 75%)}
.bcs-b3{height:clamp(440px,70vh,720px)}
.bcs-ctl{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px;z-index:3}
.bcs-ctl button{width:30px;height:28px;border-radius:6px;border:1px solid #30363D;background:rgba(22,27,34,.85);color:#E6EDF3;cursor:pointer;font-size:13px}
.bcs-ctl button:hover{border-color:#F97316}
.bcs-help{position:absolute;left:8px;bottom:6px;right:8px;font-size:10.5px;color:#8B949E;pointer-events:none;z-index:2}
.bcs-b2scroll{max-height:78vh;overflow-y:auto}
.bcs-floor{cursor:pointer;transition:filter .15s}.bcs-floor:hover{filter:brightness(1.35)}
.bcs-hint{flex:1;min-width:240px;display:flex;align-items:center;justify-content:center;min-height:260px;color:var(--bcs-muted);font-size:13px;text-align:center;border:1px dashed var(--bcs-line);border-radius:var(--bcs-r);padding:20px;line-height:1.7}
.bcs-panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.bcs-panel.slide{animation:bcsSlide .38s cubic-bezier(.2,.8,.2,1)}
@keyframes bcsSlide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.bcs-sum{background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:var(--bcs-r);padding:12px 14px}
.bcs-sh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.bcs-st{font-family:var(--bcs-display);font-size:17px;font-weight:800;color:#F97316;line-height:1.15}
.bcs-pill{font-size:11px;padding:2px 10px;border-radius:12px;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 18%,transparent)}
.bcs-muted{font-size:11.5px;color:var(--bcs-muted)}
.bcs-rchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.bcs-rchip{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:20px;border:2px solid var(--rc);background:transparent;color:var(--bcs-text);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.bcs-rchip.on{background:color-mix(in srgb,var(--rc) 20%,transparent)}
.bcs-rchip i{width:11px;height:11px;border-radius:50%}
.blink{animation:bcsBlink .9s ease-in-out infinite}
@keyframes bcsBlink{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--rc,#F97316) 0%,transparent)}50%{box-shadow:0 0 0 3px color-mix(in srgb,var(--rc,#F97316) 45%,transparent)}}
.bcs-arow{padding:10px;background:var(--bcs-card2);border:1px solid var(--rc);border-left:3px solid var(--rc);border-radius:8px;margin-top:8px;cursor:pointer;transition:transform .15s}
.bcs-arow:hover{transform:translateY(-2px)}
.bcs-arow .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bcs-arow .h b{font-size:13px}
.bcs-arow .why{margin-left:auto;font-size:11.5px;font-weight:700}
.bcs-okrow{padding:12px;text-align:center;color:#22C55E;font-size:12.5px}
.bcs-wr{display:flex;align-items:center;gap:6px;margin-top:6px;padding:6px 8px;background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:6px;font-size:11.5px;flex-wrap:wrap}
.bcs-wr .d{flex:1;min-width:120px;color:var(--bcs-muted)}
.bcs-editbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.4);border-radius:var(--bcs-r);font-size:12px}
.bcs-editbar b{color:#F97316}
.bcs-canvas{background:#0D1117;border:1px solid var(--bcs-line);border-radius:var(--bcs-r);overflow:hidden;position:relative}
.bcs-flabel{position:absolute;top:10px;left:14px;font-size:13px;font-weight:700;color:#8B949E;z-index:10;pointer-events:none}
.bcs-fmodes{position:absolute;top:8px;right:10px;z-index:12;display:flex;gap:4px}
.bcs-fmodes .bcs-mb{background:rgba(22,27,34,.85);border-color:#30363D;color:#C9D1D9}
.bcs-fmodes .bcs-mb.on{background:#F97316;border-color:#F97316;color:#fff}
.bcs-ftip{position:absolute;z-index:20;pointer-events:none;background:#161B22;color:#E6EDF3;border:1px solid #F97316;border-radius:8px;padding:8px 10px;font-size:11.5px;min-width:180px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
.bcs-pin{cursor:pointer}
.bcs-pin:hover circle{filter:brightness(1.25)}
#bcs-f2.editing .bcs-redit{cursor:move}
.bcs-rh{cursor:nwse-resize}
.bcs-legend{background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:var(--bcs-r);padding:12px 14px}
.bcs-lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.bcs-lgrid>div{background:var(--bcs-card2);border-radius:8px;padding:9px 10px;border-left:3px solid var(--rc);display:flex;flex-direction:column;gap:3px;transition:transform .15s}
.bcs-lgrid>div:hover{transform:translateY(-2px)}
.bcs-lgrid b{font-size:11.5px;color:var(--rc);display:flex;align-items:center;gap:7px}
.bcs-lgrid b i{width:13px;height:13px;border-radius:50%;border:3px solid var(--rc)}
.bcs-lgrid span{font-size:11px;color:var(--bcs-muted)}
.bcs-lnote{font-size:10.5px;color:var(--bcs-muted);margin-top:8px;text-align:right}
.bcs-tip{position:fixed;z-index:400;pointer-events:none;background:#161B22;color:#E6EDF3;border:1px solid #F97316;border-radius:8px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.6);font-size:11.5px;min-width:170px;max-width:260px}
.bcs-tip[hidden]{display:none}
.bcs-tip .t{font-weight:800;color:#F97316;font-size:12.5px;margin-bottom:2px}
.bcs-tip .s{color:#8B949E;margin-bottom:5px}
.bcs-tip .r{display:flex;justify-content:space-between;gap:12px}
.bcs-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px}
.bcs-modal[hidden]{display:none}
.bcs-mbox{background:var(--bcs-card);color:var(--bcs-text);border:1px solid var(--bcs-line);border-radius:14px;padding:18px;width:720px;max-width:100%;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:12px;animation:bcsSlide .25s ease}
.bcs-mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--bcs-line)}
.bcs-rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.bcs-ring{border:1px solid var(--rc);border-left:4px solid var(--rc);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;background:var(--bcs-card2)}
.bcs-ring b{font-size:12px;display:flex;align-items:center;gap:6px;color:var(--rc)}
.bcs-ring b i{width:10px;height:10px;border-radius:50%}
.bcs-ring span{font-size:11.5px;font-weight:600}
.bcs-msec{display:flex;flex-direction:column;gap:4px}
.bcs-li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--bcs-line);font-size:12.5px}
.bcs-li:last-child{border-bottom:none}
.bcs-mf{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding-top:6px}
.bcs-gen{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--bcs-muted)}
.bcs-gen label{display:flex;flex-direction:column;gap:3px}
.bcs-gen label.ck{flex-direction:row;align-items:center;gap:5px;padding-bottom:6px}
.bcs-in{background:var(--bcs-card2);border:1px solid var(--bcs-line);color:var(--bcs-text);border-radius:6px;padding:5px 8px;font:inherit;font-size:13px;width:90px}
.bcs-stable{display:flex;flex-direction:column;gap:5px;max-height:46vh;overflow-y:auto}
.bcs-srow{display:flex;gap:6px;align-items:center}
@media(max-width:1100px){.bcs-bwrap{flex:1 1 100%}}
@media(max-width:700px){.bcs-kpis,.bcs-lgrid,.bcs-rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.bcs-modal{align-items:flex-end;padding:0}.bcs-mbox{border-radius:14px 14px 0 0;max-height:92vh;padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
.bcs-mob .bcs-b3{height:56vh;min-height:320px}
.bcs-mob .bcs-bwrap{padding:10px}
.bcs-mob .bcs-tools{width:100%}
/*@@BCSCSS-END@@*/

/*@@IFM2CSS-START@@*/
/* ── quality metrics strip / panel ── */
.rm-strip{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.rm-card{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--bcs-card);border:1px solid var(--bcs-line);border-top:3px solid var(--rc);border-radius:var(--bcs-r);padding:11px 13px;color:var(--bcs-text);cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s,border-color .15s}
.rm-card:hover{transform:translateY(-3px);box-shadow:0 12px 22px -12px rgba(0,0,0,.45);border-color:var(--rc)}
.rm-l{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--bcs-muted)}
.rm-v{font-family:var(--bcs-display);font-size:26px;font-weight:700;line-height:1.05;color:var(--rc);font-variant-numeric:tabular-nums}
.rm-v small{font-size:13px;margin-left:2px}
.rm-s{font-size:11px;color:var(--bcs-muted)}
.rm-s u{text-decoration:none;color:var(--bcs-acc);font-weight:600}
.rm-panel{background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:var(--bcs-r);padding:12px 14px;margin-bottom:12px}
.rm-ph{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline;margin-bottom:8px}
.rm-ph b{font-family:var(--bcs-display);font-size:14px}.rm-ph span{font-size:11.5px;color:var(--bcs-muted)}
.rm-formula{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;line-height:1.8;color:var(--bcs-muted);background:var(--bcs-card2);border-radius:8px;padding:8px 12px;overflow-x:auto}
.rm-formula b{color:var(--bcs-text)}
.rm-tw{overflow-x:auto;margin-top:10px}
.rm-t{width:100%;border-collapse:collapse;font-size:12px}
.rm-t th,.rm-t td{padding:6px 8px;border-bottom:1px solid var(--bcs-line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.rm-t th:first-child,.rm-t td:first-child{text-align:left}
.rm-t th{font-size:10.5px;color:var(--bcs-muted);text-transform:uppercase;letter-spacing:.5px}
.rm-t .hl{background:color-mix(in srgb,var(--bcs-acc) 9%,transparent);font-weight:700}
.rm-empty{padding:12px;text-align:center;color:var(--bcs-muted);font-size:12.5px}
.mod-gear{white-space:nowrap}
.tabs-row{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.tabs-row .tabs{flex:1;min-width:0;margin-bottom:0}
/* ── module settings ── */
.ms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 14px}
.ms-f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;min-width:0}
.ms-f>span:first-child{font-weight:700;color:var(--bcs-muted);font-size:11.5px;letter-spacing:.3px}
.ms-f small{font-size:10.5px;color:var(--bcs-muted)}
.ms-i{display:flex;align-items:center;gap:5px;color:var(--bcs-muted);font-weight:600}
.ms-foot{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:14px;flex-wrap:wrap}
.ms-list{border:1px solid var(--bcs-line);border-radius:8px;padding:10px 12px;margin-bottom:10px;background:var(--bcs-card2)}
.ms-lh{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.ms-lh b{font-size:13px}.ms-lh small{font-size:11px;color:var(--bcs-muted);margin-right:auto}
.ms-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.ms-chip{display:inline-flex;align-items:center;gap:4px;background:var(--bcs-card);border:1px solid var(--bcs-line);border-radius:14px;padding:3px 4px 3px 10px;font-size:12px}
.ms-chip button{border:none;background:transparent;color:var(--bcs-muted);cursor:pointer;border-radius:50%;width:20px;height:20px;font-size:11px}
.ms-chip button:hover{background:#EF4444;color:#fff}
.ms-add{display:flex;gap:6px}
.ms-prow{display:flex;gap:6px;align-items:center;margin-top:5px;flex-wrap:wrap}
/* ── OM log sheet ── */
.oml-rows{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.oml-r{display:grid;grid-template-columns:minmax(0,1fr) auto 100px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--bcs-line);font-size:13px}
.oml-r .nm small{display:block;font-size:11px;color:var(--bcs-muted)}
.oml-r input{width:110px;text-align:right}
.oml-st{font-size:12px;font-weight:700;text-align:right;color:var(--bcs-muted)}
.oml-st.ok{color:#22C55E}.oml-st.ng{color:#EF4444}
.oml-seg{display:inline-flex;border:1px solid var(--bcs-line);border-radius:6px;overflow:hidden}
.oml-seg button{border:none;background:transparent;color:var(--bcs-text);padding:6px 10px;font-size:12px;cursor:pointer;font-family:inherit}
.oml-seg button+button{border-left:1px solid var(--bcs-line)}
.oml-seg button.on.ok{background:#22C55E;color:#fff}.oml-seg button.on.ng{background:#EF4444;color:#fff}.oml-seg button.on.na{background:var(--bcs-muted);color:#fff}
.oml-ph{display:flex;gap:8px;flex-wrap:wrap}
.oml-img{position:relative;width:150px;height:112px;border-radius:8px;overflow:hidden;border:1px solid var(--bcs-line);background:#000}
.oml-img img{width:100%;height:100%;object-fit:cover}
.oml-img button{position:absolute;top:4px;right:4px;border:none;border-radius:50%;width:24px;height:24px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer}
.oml-add{width:150px;height:112px;border:1.5px dashed var(--bcs-line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--bcs-muted);cursor:pointer;text-align:center}
.oml-add:hover{border-color:var(--bcs-acc);color:var(--bcs-acc)}
.oml-sig{width:100%;max-width:420px;height:128px;border:1.5px dashed var(--bcs-line);border-radius:8px;background:#fff;touch-action:none;cursor:crosshair}
.oml-sigimg{max-width:260px;height:80px;object-fit:contain;background:#fff;border:1px solid var(--bcs-line);border-radius:6px}
.oml-ck{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:10px}
.oml-mini{display:inline-flex;gap:4px;align-items:center}
.oml-mini img{width:34px;height:26px;object-fit:cover;border-radius:4px;border:1px solid var(--bcs-line)}
.oml-mini img.sg{background:#fff;object-fit:contain;width:46px}
.ma-prog{min-width:110px}
@media(max-width:900px){.rm-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.rm-strip{grid-template-columns:repeat(2,minmax(0,1fr))}.oml-r{grid-template-columns:minmax(0,1fr) auto;}.oml-r .oml-st{grid-column:1/-1;text-align:left}}
.oml-lk{border:1px solid var(--bcs-line);background:var(--bcs-card2);color:var(--bcs-acc);border-radius:6px;padding:2px 7px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.oml-lk:hover{border-color:var(--bcs-acc)}
.oml-res{display:flex;flex-direction:column;gap:2px;border-radius:10px;padding:10px 14px;margin-bottom:6px}.oml-res b{font-size:18px}.oml-res span{font-size:12.5px;color:var(--bcs-muted)}
.oml-res.ok{background:color-mix(in srgb,#22C55E 12%,transparent);border:1px solid color-mix(in srgb,#22C55E 45%,transparent)}.oml-res.ok b{color:#16A34A}
.oml-res.ng{background:color-mix(in srgb,#EF4444 12%,transparent);border:1px solid color-mix(in srgb,#EF4444 45%,transparent)}.oml-res.ng b{color:#EF4444}
@media print{body>*:not(#omlog){display:none!important}#omlog{position:static!important;background:none!important;padding:0!important}#omlog .bcs-mbox{max-height:none!important;border:0!important;box-shadow:none!important;width:100%!important}#omlog .ms-foot,#omlog .bcs-mh .bcs-btn{display:none!important}}
/*@@IFM2CSS-END@@*/
/*@@AUTHCSS-START@@*/
/* ── users & permissions ── */
.au-w,.bcs-in.au-w{width:100%;box-sizing:border-box;padding:8px 10px;font-size:13.5px}
.au-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.au-msg{font-size:12.5px;font-weight:600}
.au-pw{display:flex;flex-direction:column;gap:10px;max-width:420px}
.au-err{background:color-mix(in srgb,#EF4444 12%,transparent);border:1px solid color-mix(in srgb,#EF4444 40%,transparent);color:#EF4444;border-radius:8px;padding:8px 12px;font-size:13px}
.au-note{font-size:12px;color:var(--bcs-muted);background:var(--bcs-card2);border:1px solid var(--bcs-line);border-radius:8px;padding:8px 12px;margin:10px 0;line-height:1.5}
.au-chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--bcs-card2);border:1px solid color-mix(in srgb,var(--cc,var(--bcs-line)) 60%,var(--bcs-line));color:var(--bcs-text);white-space:nowrap}
.au-chip.au-warn{border-color:#EAB308;color:#B45309}
.au-chips{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.au-role{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--rc);background:color-mix(in srgb,var(--rc) 14%,transparent);border:1px solid color-mix(in srgb,var(--rc) 45%,transparent);white-space:nowrap}
.au-av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;color:var(--rc);background:color-mix(in srgb,var(--rc) 15%,transparent);border:1.5px solid color-mix(in srgb,var(--rc) 50%,transparent);flex:none}
.au-av.sm{width:34px;height:34px;font-size:14px}
.au-me{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.au-nm{font-weight:700;font-size:16px}
.au-kv{display:grid;grid-template-columns:80px 1fr;gap:6px 10px;font-size:13px;align-items:start}
.au-kv>span{color:var(--bcs-muted);font-size:12px;font-weight:700;padding-top:2px}
.au-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.au-stat{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--bcs-card);border:1px solid var(--bcs-line);border-top:3px solid var(--sc);border-radius:10px;padding:8px 12px;cursor:pointer;color:var(--bcs-text);font:inherit;transition:transform .15s,box-shadow .15s}
.au-stat:hover{transform:translateY(-2px);box-shadow:0 10px 18px -12px rgba(0,0,0,.45)}
.au-stat.on{background:color-mix(in srgb,var(--sc) 12%,var(--bcs-card))}
.au-stat b{font-size:22px;line-height:1.1;color:var(--sc);font-family:var(--bcs-display)}.au-stat span{font-size:11.5px;color:var(--bcs-muted);font-weight:600}
.au-pend{border:1px solid #EAB308;border-radius:10px;padding:10px 12px;margin-bottom:10px;background:color-mix(in srgb,#EAB308 7%,var(--bcs-card))}

// ---------- KPI calculations ----------
function slaOf(t){const S=SLA[t.priority]||SLA.P3,f=S.f*6e4,st=new Date(t.date).getTime();
  if(t.completedAt){return{s:(new Date(t.completedAt).getTime()-st)<=f?'met':'breach'}}
  if(t.status==='On Hold')return{s:'hold'};
  const left=st+f-Date.now();return left<0?{s:'breach',open:1}:{s:'open',left:left/6e4}}
function slaPct(svc){let m=0,b=0;D.tickets.forEach(t=>{if(svc?t.service!==svc:!svcOn(t.service))return;const s=slaOf(t).s;if(s==='met')m++;else if(s==='breach')b++});return m+b?Math.round(m/(m+b)*100):100}
function pmPct(svc){const t=D.pm.filter(p=>p.service===svc&&p.dueDate<=todayS);return t.length?Math.round(t.filter(p=>p.status==='Done').length/t.length*100):100}
function compRows(svc){return D.compliance.filter(x=>!svc||x.service===svc).map(SCH.compliance.derive)}
function compPct(svc){const c=compRows(svc);return c.length?Math.round(c.filter(x=>x.status!=='Overdue').length/c.length*100):100}
function uptime(){const a=D.assets;return a.length?Math.round(a.filter(x=>x.status==='Running'||x.status==='Standby').length/a.length*100):100}
function defClose(){const d=D.defects;return d.length?Math.round(d.filter(x=>x.status==='Closed').length/d.length*100):100}
function hkScore(days=30){const s=D.hkInsp.filter(x=>x.date>=addD(todayS,-days));return s.length?avg(s.map(x=>x.score)):0}
function hkDone(){const t=D.hkTasks;return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function patrolPct(post){const p=D.patrols.filter(x=>x.date>=addD(todayS,-7)&&(!post||x.post===post));const pl=sum(p,x=>x.planned);return pl?Math.round(sum(p,x=>x.scanned)/pl*100):100}
function incClose(){const s=D.secInc;return s.length?Math.round(s.filter(x=>x.status==='Closed').length/s.length*100):100}
function pestPct(){const s=D.pestSt;return s.length?Math.round(s.filter(x=>x.activity==='None'||x.activity==='Low').length/s.length*100):100}
function gdnPct(){const z=D.gdnZones;return z.length?Math.round(sum(z,x=>x.health==='Good'?1:x.health==='Fair'?.6:0)/z.length*100):100}
function gdnOnTime(){const t=D.gdnTasks.filter(x=>x.status!=='Scheduled');return t.length?Math.round(t.filter(x=>x.status==='Done').length/t.length*100):100}
function linPct(){return D.linenItems.length?avg(D.linenItems.map(x=>SCH.linenItems.derive(x)._avail)):100}
function linLoss(){const par=sum(D.linenItems,x=>x.par);return par?Math.round(sum(D.linenItems,x=>(+x.reject||0)+(+x.lost||0))/par*1000)/10:0}
const SCORE={
  eng:()=>avg([slaPct('eng'),pmPct('eng'),uptime(),compPct('eng')]),
  fac:()=>avg([slaPct('fac'),pmPct('fac'),compPct('fac'),defClose()]),
  hk:()=>avg([slaPct('hk'),hkScore(),hkDone()]),
  sec:()=>avg([slaPct('sec'),patrolPct(),incClose()]),
  pest:()=>avg([slaPct('pest'),pestPct()]),
  gdn:()=>avg([slaPct('gdn'),gdnPct(),gdnOnTime()]),
  lin:()=>avg([slaPct('lin'),linPct()]),
};
function KPIS(){const T=P().target;return[
  ['eng','SLA งานแจ้งซ่อม',()=>slaPct('eng'),T.sla,'%',0,'sla'],['eng','PM Compliance',()=>pmPct('eng'),T.pm,'%',0,'pm'],['eng','Asset Uptime',uptime,T.uptime,'%',0,'uptime'],['eng','Statutory Compliance',()=>compPct('eng'),T.comp,'%',0,'comp'],
  ['fac','SLA งานแจ้งซ่อม',()=>slaPct('fac'),T.sla,'%',0,'sla'],['fac','PM Compliance (อาคาร)',()=>pmPct('fac'),T.pm,'%',0,'pm'],['fac','Life-safety Compliance',()=>compPct('fac'),T.comp,'%',0,'comp'],['fac','Defect Closure',defClose,T.defect,'%',0,'defect'],
  ['hk','SLA งานแจ้ง',()=>slaPct('hk'),T.sla,'%',0,'sla'],['hk','Cleanliness Score (30 วัน)',()=>hkScore(),T.hk,'%',0,'hk'],['hk','Task Completion',hkDone,T.hkTask,'%',0,'hkTask'],
  ['sec','SLA งานแจ้ง',()=>slaPct('sec'),T.sla,'%',0,'sla'],['sec','Patrol Compliance (7 วัน)',()=>patrolPct(),T.patrol,'%',0,'patrol'],['sec','Incident Closure',incClose,T.incident,'%',0,'incident'],
  ['pest','SLA งานแจ้ง',()=>slaPct('pest'),T.sla,'%',0,'sla'],['pest','Station Clean Rate',pestPct,T.pest,'%',0,'pest'],
  ['gdn','SLA งานแจ้ง',()=>slaPct('gdn'),T.sla,'%',0,'sla'],['gdn','Zone Health',gdnPct,T.gdn,'%',0,'gdn'],['gdn','Task On-time',gdnOnTime,T.gdnTask,'%',0,'gdnTask'],
  ['lin','SLA งานแจ้ง',()=>slaPct('lin'),T.sla,'%',0,'sla'],['lin','Linen Availability',linPct,T.lin,'%',0,'lin'],['lin','Reject + Lost Rate',linLoss,T.linLoss,'%',1,'linLoss'],
].concat((D.kpiCustom||[]).map(c=>[c.service,c.name,()=>(c.actual===''||c.actual==null)?null:+c.actual,+c.target||0,c.unit||'',c.dir==='≤'?1:0,c.id,true])).filter(k=>svcOn(k[0]))}
const scoreColor=v=>v>=90?'var(--green)':v>=75?'var(--yellow)':'var(--red)';
const openWR=svc=>D.tickets.filter(t=>(svc?t.service===svc:svcOn(t.service))&&t.status!=='Closed'&&t.status!=='Completed').length;

function alerts(){const A=[];
  D.tickets.forEach(t=>{const s=slaOf(t);if(s.s==='breach'&&s.open)A.push({lv:'red',svc:t.service,m:`${t.id} เกิน SLA — ${t.desc}`,s:`${t.area} · ${t.priority}`,v:'helpdesk'})});
  D.assets.filter(a=>a.status==='Down').forEach(a=>A.push({lv:'red',svc:'eng',m:`${a.name} หยุดทำงาน`,s:`${a.area} · Criticality ${a.crit}`,v:'eng'}));
  compRows().filter(c=>c.status==='Overdue').forEach(c=>A.push({lv:'red',svc:c.service,m:`Compliance เลยกำหนด: ${c.item}`,s:`${c.standard} · ครบ ${fmtD(c._nextDue)}`,v:c.service}));
  D.defects.filter(d=>d.status!=='Closed'&&(d.severity==='Critical'||d.target<todayS)).forEach(d=>A.push({lv:d.severity==='Critical'?'red':'yellow',svc:'fac',m:`Defect ${d.element}: ${d.desc}`,s:`${d.area} · กำหนด ${fmtD(d.target)}`,v:'fac'}));
  D.pestSt.filter(s=>s.activity==='High').forEach(s=>A.push({lv:'yellow',svc:'pest',m:`พบความเคลื่อนไหวสูง — ${s.type}`,s:`${s.id} · ${s.area}`,v:'pest'}));
  D.linenItems.map(SCH.linenItems.derive).filter(x=>x._avail<90).forEach(x=>A.push({lv:'yellow',svc:'lin',m:`ผ้าต่ำกว่า Par: ${x.name}`,s:`Availability ${x._avail}%`,v:'lin'}));
  compRows().filter(c=>c.status==='Due Soon').forEach(c=>A.push({lv:'blue',svc:c.service,m:`ใกล้ครบกำหนด: ${c.item}`,s:`อีก ${c._dl} วัน`,v:c.service}));
  if(typeof siContractAlert==='function'&&(cap('set')||myRole()==='client')){const x=siContractAlert();if(x)A.push(x)}
  const o={red:0,yellow:1,blue:2};return A.filter(a=>!SVC[a.svc]||svcOn(a.svc)).sort((a,b)=>o[a.lv]-o[b.lv]);
}


function nextId(ent){const S=SCH[ent];const mx=D[ent].reduce((m,r)=>{const n=parseInt(String(r.id||'').split('-').pop(),10);return isNaN(n)?m:Math.max(m,n)},0);return S.pfx+'-'+pad(mx+1,S.l4?4:3)}

function applyPrefs(){
  const th=LS.get(MK.theme,'system'),ft=LS.get(MK.font,'default');
  let dark=th==='dark';
  let dim=false;if(th==='system'){const dt=document.documentElement.getAttribute('data-theme');const osDark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;dark=dt?dt==='dark':true;dim=!dt&&!osDark}
  document.body.classList.toggle('theme-dark',dark);document.body.classList.toggle('theme-dim',dim);
  document.body.classList.toggle('font-sarabun',ft==='sarabun');
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',dim?'#2d333b':dark?'#0d1117':'#f2f2f3');
}

    +'<div class="field"><label for="fg-who">'+tx('Username หรืออีเมล','Username or email')+'</label><input class="input" id="fg-who" autocapitalize="none" autocomplete="username" value="'+esc(FGM.who)+'"></div>'
    +'<button type="submit" class="btn btn-primary btn-block" id="fg-go">📧 '+tx('ส่งรหัสยืนยันทางอีเมล','Email me a code')+'</button>'
    +'<div class="row" style="justify-content:space-between">'+lk(tx('← กลับ','← Back'),"LGM.tab='login';LGM.msg='';LGM.ok='';render()")+lk(tx('มีรหัสแล้ว ›','I have a code ›'),"FGM.step=2;FGM.who=lgvM('fg-who');LGM.msg='';LGM.ok='';render()")+'</div></form>';

    +(FGM.demo?'<div class="note" style="color:var(--green);font-weight:600">🧪 '+tx('โหมดสาธิต: รหัสยืนยันคือ ','Demo mode: your code is ')+'<b style="letter-spacing:3px">'+esc(FGM.demo)+'</b></div>':'')
    +'<div class="field"><label for="fg-code">'+tx('รหัสยืนยัน 6 หลัก','6-digit code')+'</label><input class="input" id="fg-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" style="font-size:24px;letter-spacing:10px;text-align:center"></div>'
    +'<div class="field"><label for="fg-pw">'+tx('รหัสผ่านใหม่ (6 ตัวขึ้นไป)','New password (6+)')+'</label><input class="input" id="fg-pw" type="password" autocomplete="new-password"></div>'
    +'<div class="field"><label for="fg-pw2">'+tx('ยืนยันรหัสผ่านใหม่','Confirm new password')+'</label><input class="input" id="fg-pw2" type="password" autocomplete="new-password"></div>'
    +'<button type="submit" class="btn btn-primary btn-block" id="fg-go">✅ '+tx('ตั้งรหัสผ่านใหม่','Save new password')+'</button>'
    +'<div class="row" style="justify-content:space-between">'+lk(tx('← ขอรหัสใหม่','← New code'),"FGM.step=1;LGM.msg='';LGM.ok='';render()")+lk(tx('กลับไปเข้าสู่ระบบ','Back to sign in'),"LGM.tab='login';LGM.msg='';LGM.ok='';render()")+'</div></form>'}
async function doForgotM(){FGM.who=lgvM('fg-who');const b=document.getElementById('fg-go');if(b)b.disabled=true;
  try{const j=await authForgot(FGM.who);FGM.demo=j.demoCode||'';FGM.step=2;LGM.msg='';LGM.ok=j.message||'';render()}catch(e){LGM.msg=e.message;LGM.ok='';render()}}
async function doResetM(){const code=lgvM('fg-code'),pw=document.getElementById('fg-pw').value,pw2=document.getElementById('fg-pw2').value,keep=()=>{const c=document.getElementById('fg-code');if(c)c.value=code};
  if(!/^\d{6}$/.test(code)){LGM.msg=tx('กรอกรหัสยืนยัน 6 หลัก','Enter the 6-digit code');LGM.ok='';render();return}
  if(pw.length<6||pw!==pw2){LGM.msg=pw.length<6?tx('รหัสผ่านใหม่ต้องมีอย่างน้อย 6 ตัวอักษร','Password needs 6+ characters'):tx('รหัสผ่านใหม่ไม่ตรงกัน','Passwords do not match');LGM.ok='';render();keep();return}
  const b=document.getElementById('fg-go');if(b)b.disabled=true;
  try{const j=await authReset(FGM.who,code,pw);FGM.demo='';LGM.tab='login';LGM.msg='';LGM.ok=tx('✅ ตั้งรหัสผ่านใหม่แล้ว — เข้าสู่ระบบได้เลย','✅ Password updated — sign in now');render();const u=document.getElementById('li-user');if(u)u.value=j.username||FGM.who}
  catch(e){LGM.msg=e.message;LGM.ok='';render();keep()}}

function refreshLists2(){if(!FM)return;const S=SCH[FM.ent];const cur={};S.fields.forEach(f=>{const e=document.getElementById('m_'+f.k);if(e)cur[f.k]=e.value});
  S.fields.filter(f=>f.list).forEach(f=>{const dl=document.getElementById('mdl_'+f.k);if(dl)dl.innerHTML=(f.list(cur)||[]).map(x=>'<option value="'+esc(x)+'">').join('')})}
function submit2(){if(!FM)return;if(FM.ro){denied();return}const{ent,id}=FM,S=SCH[ent];const r=id?{...D[ent].find(x=>x.id===id)}:{};
  for(const f of S.fields){const e=document.getElementById('m_'+f.k);let v=e?e.value.trim():'';
    if(f.req&&v===''){document.getElementById('m-err').textContent=tx('กรุณากรอก “','Please fill in “')+(typeof f.l==='function'?f.l():f.l)+'”';e&&e.focus();return}
    if(f.t==='number'&&v!==''){v=+v;if(f.max!=null&&v>f.max)v=f.max;if(f.min!=null&&v<f.min)v=f.min}r[f.k]=v}
  S.onSave&&S.onSave(r);

  else{r.id=nextId(ent);S.onCreate&&S.onCreate(r);D[ent].unshift(r);toast(tx('เพิ่ม ','Added ')+r.id)}

  const{ent,id}=FM;D[ent]=D[ent].filter(r=>r.id!==id);save();closeSheet();render();toast(tx('ลบ ','Deleted ')+id)}

/* ═══════════════════════════════════════════════════════════════════
   BUILDING CRITICAL STATUS (BCS) — shared by IFM desktop + IFM mobile
   Ported from iMATOMs v3.0 Building Critical Status:
   3D building (3 styles + 2D) · per-floor plan (3D / 2D) · 4-Ring System
   IFM 4-Ring is evaluated per AREA:
     วง 1 WR   — open work requests (all services) · red = over SLA / P1
     วง 2 HARD — assets Down / Warning · open building defects
     วง 3 PPM  — PM overdue / due in 7 days · missed housekeeping tasks
     วง 4 SOFT — cleanliness below target · pest activity · security incidents
   Data: D.bldg.floors / D.bldg.rooms (inside the shared IFM data store),
         floor-plan images in localStorage 'psd_ifm_plan_<biz>_<floor>'.
   ═══════════════════════════════════════════════════════════════════ */
const BR_COL=['#F97316','#06B6D4','#A855F7','#EC4899'];
const BR_KEY=['r1','r2','r3','r4'];
const BR_NAME=['WR','HARD','PPM','SOFT'];
const BR_DESC=[['งานแจ้งซ่อม / แจ้งบริการค้าง','Open work requests'],['อุปกรณ์ Down/Warning · Defect ระดับ Medium+','Assets down / warning · defects Medium+'],['PM เกิน/ครบใน 7 วัน · งานแม่บ้าน Missed','PM overdue / due 7 days · missed HK'],['ความสะอาดตรวจล่าสุด < 85% · Pest ระดับ High · เหตุ รปภ. Medium+','Cleanliness < 85% · pest High · incidents Medium+']];
const BR_GO=['helpdesk','eng','eng','hk'];
const BCS={sel:null,ring:'r1',mod:'',edit:false,kind:'desk',host:{},st:null,rd:null,rows:[]};
const bT=(th,en)=>(BCS.host.lang&&BCS.host.lang()==='en')?en:th;
function bLS(k,d){try{const v=localStorage.getItem('psd_ifm_'+k);return v==null?d:v}catch(e){return d}}
function bLSset(k,v){try{localStorage.setItem('psd_ifm_'+k,v)}catch(e){}}
const bIsBase=c=>/^B\d+$/i.test(String(c).trim());
const bOK=n=>({bad:0,c:'#22C55E',k:0,n});

/* ---------- floors ---------- */
function bcsName(c){c=String(c);if(/^roof$/i.test(c))return'Roof Level';if(/^g$/i.test(c))return'Ground Floor (G)';if(bIsBase(c))return'ชั้น '+c.toUpperCase();if(/^\d+$/.test(c))return'ชั้น '+c;return c}
function bcsMakeFloors(b,t,roof,prev){
  b=Math.max(0,Math.min(10,b|0));t=Math.max(1,Math.min(80,t|0));
  const codes=[];if(roof)codes.push('Roof');for(let n=t;n>=2;n--)codes.push(String(n));codes.push('G');for(let n=1;n<=b;n++)codes.push('B'+n);
  const old={};(prev||[]).forEach(f=>old[String(f.code).toUpperCase()]=f.name);
  return codes.map((c,i)=>({id:c.toUpperCase(),code:c,name:old[c.toUpperCase()]||bcsName(c),order:codes.length-i}))}
function bcsTokens(s){return String(s||'').toUpperCase().split(/[-–,\/]/).map(x=>x.trim()).filter(Boolean)}
function bcsAutoFloors(){let b=0,t=1,roof=false;
  D.areas.forEach(a=>bcsTokens(a.floor).forEach(x=>{if(x==='ROOF')roof=true;else{const m=x.match(/^B(\d+)$/);if(m)b=Math.max(b,+m[1]);else if(/^\d+$/.test(x))t=Math.max(t,+x)}}));
  return bcsMakeFloors(b,t,roof,[])}
function bcsFloors(){if(!D.bldg)D.bldg={floors:[],rooms:{}};if(!D.bldg.rooms)D.bldg.rooms={};if(!D.bldg.floors||!D.bldg.floors.length)D.bldg.floors=bcsAutoFloors();return D.bldg.floors.slice().sort((a,b)=>b.order-a.order)}
function bcsFloorById(id){return bcsFloors().find(f=>f.id===id)}
function bcsAreaFloor(a){const fl=bcsFloors(),ids=new Set(fl.map(f=>f.id));
  for(const x of bcsTokens(a.floor)){if(ids.has(x))return x;if((x==='1'||/^(GF|G\/F|GROUND|L1)$/.test(x))&&ids.has('G'))return'G'}
  return ids.has('G')?'G':(fl[fl.length-1]||{}).id}

/* ---------- 4-ring per area ---------- */
function bcsOpenWR(t){return t.status!=='Closed'&&t.status!=='Completed'}
function bcsAreaRS(a){
  const n=a.name,T=P().target,in7=addD(todayS,7);
  const ow=D.tickets.filter(t=>t.area===n&&bcsOpenWR(t)&&svcOn(t.service));
  const crW=ow.filter(t=>t.priority==='P1'||slaOf(t).s==='breach');
  const as=svcOn('eng')?D.assets.filter(x=>x.area===n):[];
  const down=as.filter(x=>x.status==='Down'),warn=as.filter(x=>x.status==='Warning');
  const df=svcOn('fac')?D.defects.filter(d=>d.area===n&&d.status!=='Closed'&&d.severity!=='Low'):[];
  const items=new Set(as.map(x=>x.name).concat([n]));
  const pmO=D.pm.filter(p=>svcOn(p.service)&&items.has(p.item)&&p.status!=='Done'&&p.dueDate<todayS);
  const pm7=D.pm.filter(p=>svcOn(p.service)&&items.has(p.item)&&p.status!=='Done'&&p.dueDate>=todayS&&p.dueDate<=in7);
  const hkM=svcOn('hk')?D.hkTasks.filter(h=>h.area===n&&h.status==='Missed'):[];
  const ins=svcOn('hk')?D.hkInsp.filter(x=>x.area===n&&x.date>=addD(todayS,-30)):[];const hkA=ins.length?avg(ins.map(x=>x.score)):null;
  const pst=svcOn('pest')?D.pestSt.filter(s=>s.area===n&&s.activity==='High'):[];
  const inc=svcOn('sec')?D.secInc.filter(s=>s.area===n&&s.status!=='Closed'&&s.severity!=='Low'):[];
  const hkLast=ins.slice().sort((x,y)=>y.date.localeCompare(x.date))[0];const hkLow=hkA!=null&&((hkLast&&+hkLast.score<85)||hkA<Math.min(T.hk,90)-5);
  const j=a=>a.filter(Boolean).join(' · ');
  const r1=ow.length?{bad:1,c:crW.length?'#EF4444':BR_COL[0],k:ow.length,n:crW.length?j([bT('เกิน SLA/P1 ','Over SLA/P1 ')+crW.length,bT('เปิด ','open ')+ow.length]):bT('WR เปิด ','Open WR ')+ow.length}:bOK(bT('ไม่มีงานค้าง','No open WR'));
  const k2=down.length+warn.length+df.length;
  const r2=k2?{bad:1,c:BR_COL[1],k:k2,n:j([down.length&&'Down '+down.length,warn.length&&'Warning '+warn.length,df.length&&'Defect '+df.length])}:bOK(bT('อุปกรณ์/อาคารปกติ','Assets & fabric OK'));
  const k3=pmO.length+pm7.length+hkM.length;
  const r3=k3?{bad:1,c:BR_COL[2],k:k3,n:j([pmO.length&&bT('PM เกินกำหนด ','PM overdue ')+pmO.length,pm7.length&&bT('PM ใน 7 วัน ','PM in 7d ')+pm7.length,hkM.length&&bT('แม่บ้าน Missed ','HK missed ')+hkM.length])}:bOK(bT('ตามแผน','On plan'));
  const k4=(hkLow?1:0)+pst.length+inc.length;
  const r4=k4?{bad:1,c:BR_COL[3],k:k4,n:j([hkLow&&bT('ความสะอาด ','Clean ')+hkA+'%',pst.length&&'Pest '+pst.length+bT(' จุด',' pts'),inc.length&&bT('เหตุ รปภ. ','Incident ')+inc.length])}:bOK(bT('ปกติ','Normal'));
  const crit=crW.length>0||down.length>0||df.some(d=>d.severity==='Critical')||pst.some(s=>s.activity==='High');
  const mods={},add=(k,parts,crit,list)=>{if(!svcOn(k))return;const ws=ow.filter(t=>t.service===k),cw=ws.filter(t=>t.priority==='P1'||slaOf(t).s==='breach').length;
    const ps=parts.filter(x=>x&&x[1]);const n=ws.length+ps.reduce((s,x)=>s+x[1],0);if(!n)return;
    mods[k]={k:n,crit:!!(crit||cw),ow:ws,n:j([ws.length&&('WR '+ws.length+(cw?' ('+bT('เกิน SLA/P1 ','over SLA/P1 ')+cw+')':''))].concat(ps.map(x=>x[0]+' '+x[1])))}};
  const pmS=s=>pmO.filter(p=>p.service===s).length+pm7.filter(p=>p.service===s).length;
  add('eng',[['Down',down.length],['Warning',warn.length],[bT('PM ค้าง/ใน 7 วัน','PM due'),pmS('eng')]],down.length>0);
  add('fac',[['Defect',df.length],[bT('PM ค้าง/ใน 7 วัน','PM due'),pmS('fac')]],df.some(d=>d.severity==='Critical'));
  add('hk',[[bT('งาน Missed','Missed'),hkM.length],[bT('ความสะอาดต่ำ','Low clean score'),hkLow?1:0],[bT('PM','PM'),pmS('hk')]]);
  add('sec',[[bT('เหตุ รปภ.','Incident'),inc.length]],inc.some(x=>x.severity==='High'||x.severity==='Critical'));
  add('pest',[[bT('จุดพบสูง','High activity'),pst.length]],pst.length>0);
  add('gdn',[[bT('PM','PM'),pmS('gdn')]]);add('lin',[[bT('PM','PM'),pmS('lin')]]);
  return{r1,r2,r3,r4,crit,bad:!!(r1.bad||r2.bad||r3.bad||r4.bad),mods,ow,as,down,warn,df,pmO,pm7,hkM,hkA,pst,inc}}
function bcsFloorStatus(){const out={};bcsFloors().forEach(f=>out[f.id]={n:0,r1:0,r2:0,r3:0,r4:0,crit:0,bad:false,items:[],m:{}});
  D.areas.forEach(a=>{const o=out[bcsAreaFloor(a)];if(!o)return;const rs=bcsAreaRS(a);o.n++;BR_KEY.forEach(k=>{if(rs[k].bad)o[k]++});Object.keys(rs.mods).forEach(k=>{o.m[k]=(o.m[k]||0)+1});if(rs.crit)o.crit++;o.items.push({a,rs})});
  Object.values(out).forEach(o=>o.bad=(o.r1+o.r2+o.r3+o.r4)>0);BCS.st=out;return out}

/* ---------- rooms (areas) on a floor ---------- */
function bcsRooms(fid,svgH){const ar=D.areas.filter(a=>bcsAreaFloor(a)===fid),L=D.bldg.rooms||{},n=ar.length;if(!n)return[];
  const cols=Math.ceil(Math.sqrt(n*1.7)),rows=Math.ceil(n/cols),gx=18,gy=18,pw=820,ph=(svgH||540)-90;
  const w=(pw-(cols-1)*gx)/cols,h=Math.min(260,(ph-(rows-1)*gy)/rows),oy=Math.max(40,((svgH||540)-(rows*h+(rows-1)*gy))/2);
  return ar.map((a,i)=>{const p=L[a.id];if(p)return{a,x:p.x,y:p.y,w:p.w,h:p.h};const c=i%cols,r=Math.floor(i/cols);return{a,x:40+c*(w+gx),y:oy+r*(h+gy),w,h}})}

const F3={ok:null,renderer:null,scene:null,cam:null,group:null,el:null,pick:[],anim:[],th:0.6,ph:0.95,rad:20,rmin:5,rmax:80,drag:null,rc:null,floor:null,tex:{},info:{}};

function fp3dInit(){const el=document.getElementById('bcs-f3');if(!el)return false;

  try{const r=new THREE.WebGLRenderer({antialias:true,alpha:true});r.outputEncoding=THREE.sRGBEncoding;r.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

    F3.ok=true;

      const w=F3.el.clientWidth||640,h=Math.max(300,Math.min(640,Math.round(w*(BCS.kind==='mob'?0.85:0.62))));

        else if(a.k==='room'){const q=0.5+0.5*Math.sin(s*6+a.ph);a.m.opacity=0.08+0.34*q;if(a.w)a.w.emissiveIntensity=0.15+0.6*q}});

function bcsSetupSave(){const rows=BCS.rows,seen=new Set(),err=m=>{const e=document.getElementById('bs-err');if(e)e.textContent=m};
  if(!rows.length)return err(bT('ต้องมีอย่างน้อย 1 ชั้น','Add at least one floor'));

async function bcsPlanUpload(inp){const file=inp.files[0];inp.value='';if(!file)return;const fid=BCS.sel;const tst=m=>BCS.host.toast&&BCS.host.toast(m);
  if(!fid){tst(bT('เลือกชั้นก่อน','Pick a floor first'));return}
  try{tst(bT('⏳ กำลังประมวลผล floor plan…','⏳ Processing floor plan…'));const MAXW=1600,cv=document.createElement('canvas'),ctx=cv.getContext('2d');
    if(/pdf/i.test(file.type)||/\.pdf$/i.test(file.name)){if(!window.pdfjsLib){tst(bT('⚠ PDF.js ยังโหลดไม่เสร็จ','⚠ PDF.js not loaded'));return}
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,page=await pdf.getPage(1),v0=page.getViewport({scale:1}),vp=page.getViewport({scale:MAXW/v0.width});
      cv.width=Math.round(vp.width);cv.height=Math.round(vp.height);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);await page.render({canvasContext:ctx,viewport:vp}).promise}
    else{const url=URL.createObjectURL(file),img=new Image();await new Promise((ok,ng)=>{img.onload=ok;img.onerror=ng;img.src=url});const sc=Math.min(1,MAXW/img.naturalWidth);
      cv.width=Math.round(img.naturalWidth*sc);cv.height=Math.round(img.naturalHeight*sc);ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);ctx.drawImage(img,0,0,cv.width,cv.height);URL.revokeObjectURL(url)}
    const plan={dataUrl:cv.toDataURL('image/jpeg',.78),svgH:Math.round(cv.height*900/cv.width)};
    try{localStorage.setItem('psd_ifm_plan_'+BIZK+'_'+fid,JSON.stringify(plan))}catch(e){tst(bT('❌ พื้นที่เก็บในเบราว์เซอร์เต็ม — ใช้ไฟล์ขนาดเล็กลง','❌ Browser storage full — use a smaller file'));return}
    tst(bT('✅ อัปโหลด floor plan ของชั้นนี้แล้ว','✅ Floor plan saved for this floor'));bcsRenderFloor(fid)}
  catch(err){tst(bT('❌ อ่านไฟล์ไม่ได้: ','❌ Cannot read file: ')+(err.message||err))}}

/* ---------- quality metrics (iMATOMs Reliability Module v1.3 formulas) ----------
   MTTR            = Σ repair hours ÷ closed jobs                     (repair = report/respond → completed)
   MTBF            = (Operating hours − Downtime) ÷ Failures           (operating hours = period × hrs/day)
   Availability    = Operational: (Operating − Downtime) ÷ Operating  |  Inherent: MTBF ÷ (MTBF + MTTR)
   Maintainability = 1 − e^(−Target repair time ÷ MTTR)
   Reliability     = e^(−Test time ÷ MTTF), MTTF = [Duty cycle − Repair time/Count] × Load factor,
                     Duty cycle = hrs/day × working days/yr            (alt: e^(−Test time ÷ MTBF)) */
function modUnits(svc){const C=modCalc(svc);if(+C.units>0)return +C.units;return Math.max(1,{eng:D.assets.length,fac:D.areas.length,hk:D.areas.length,sec:modList('sec','posts').length,pest:D.areas.length,gdn:D.gdnZones.length,lin:D.linenItems.length}[svc]||1)}
function relCalc(C,list,units){units=Math.max(1,units||1);
  const since=addD(todayS,-C.periodDays);const t=list.filter(x=>String(x.date).slice(0,10)>=since&&(C.countP4||x.priority!=='P4'));
  const rh=t.filter(x=>x.completedAt).map(x=>{const s=new Date(C.mttrFrom==='respond'&&x.respondedAt?x.respondedAt:x.date),e=new Date(x.completedAt);return Math.max(0,(e-s)/36e5)});
  const fails=t.length,down=rh.reduce((s,v)=>s+v,0),mttr=rh.length?down/rh.length:null,op=C.periodDays*C.hrsDay*units;
  const mtbf=fails?Math.max(0,(op-down)/fails):op;

  return{units,mttr,mtbf,avail:C.availMethod==='inherent'?availIn:availOp,availOp,availIn,maint,rel,mttf,duty,down,fails,done:rh.length,op,C,noFail:!fails}}
function relMetrics(svc){return relCalc(modCalc(svc),D.tickets.filter(x=>x.service===svc),modUnits(svc))}

const SYNC={busy:false,pulling:false,t:null,status:'off',msg:'',last:null,again:false,onStatus:null};
const SYNC_CFG_KEYS=['_v','site','created','hist','svcOff','targetOv','modCfg','bldg','siteInfo'];
const SYNC_ENTS=()=>Object.keys(SCH).filter(k=>Array.isArray(D[k]));
function gasCfg(){return Object.assign({url:'',key:'',auto:true},LS.get('psd_ifm_gas',{}))}
function gasSite(){return LS.get('psd_ifm_site_'+BIZK,'')}
function gasReady(){const c=gasCfg();return!!(c.url&&gasSite()&&(typeof DMODE!=='function'||DMODE()!=='sample')&&((typeof sessTok==='function'&&sessTok())||c.key))}
function syncHashKey(){return'psd_ifm_synch_'+BIZK+'_'+gasSite()}
function syncBaseKey(){return'psd_ifm_syncrow_'+BIZK+'_'+gasSite()}
const rowMap=a=>{const m={};(a||[]).forEach(r=>{m[String(r.id)]=hashOf(JSON.stringify(r))});return m};
function hashOf(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
function setSyncStatus(st,msg){SYNC.status=st;SYNC.msg=msg||'';if(st==='ok')SYNC.last=new Date();SYNC.onStatus&&SYNC.onStatus(st,msg)}
async function gasCall(action,body){const c=gasCfg();if(!c.url)throw new Error('ยังไม่ได้ใส่ Web App URL');
  const res=await fetch(c.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:(typeof sessTok==='function'&&sessTok())||undefined,key:c.key||undefined,site:gasSite(),business:BIZK,siteName:D&&D.site},body||{}))});
  let j;try{j=await res.json()}catch(e){throw new Error('Web App ตอบกลับไม่ใช่ JSON — ตรวจ URL และสิทธิ์ Deploy (Anyone)')}if(!j.ok){const er=new Error(j.error||'Request failed');er.auth=!!j.auth;if(j.auth&&action!=='login'&&typeof authExpired==='function')setTimeout(()=>authExpired(j.error),0);throw er}return j}
function syncNormalize(tables){Object.entries(tables||{}).forEach(([e,rows])=>{const S=SCH[e];if(!S||!Array.isArray(rows))return;const nums=S.fields.filter(f=>f.t==='number').map(f=>f.k);
  rows.forEach(r=>{nums.forEach(k=>{if(r[k]!==''&&r[k]!=null&&!isNaN(+r[k]))r[k]=+r[k]});Object.keys(r).forEach(k=>{if(r[k]==null)r[k]=''})})});return tables}
async function syncPush(all){if(!gasReady())return;if(SYNC.busy){SYNC.again=true;return}SYNC.busy=true;setSyncStatus('busy');
  try{const H=all?{}:LS.get(syncHashKey(),{}),nh=Object.assign({},H),tables={},base=LS.get(syncBaseKey(),{});
    SYNC_ENTS().forEach(e=>{if(typeof canPushEnt==='function'&&!canPushEnt(e))return;const h=hashOf(JSON.stringify(D[e]));if(H[e]===h)return;nh[e]=h;
      if(all||!base[e]){tables[e]={rows:D[e],full:true};return}
      const b=base[e],ids=new Set();const rows=D[e].filter(r=>{const id=String(r.id);ids.add(id);return b[id]!==hashOf(JSON.stringify(r))});
      const deleted=Object.keys(b).filter(id=>!ids.has(id));if(rows.length||deleted.length)tables[e]={rows,deleted,full:false}});
    const cfg={};SYNC_CFG_KEYS.forEach(k=>{if(D[k]!==undefined)cfg[k]=D[k]});const ch=hashOf(JSON.stringify(cfg)),sendCfg=H._cfg!==ch&&(typeof cap!=='function'||cap('set'));nh._cfg=ch;
    if(!Object.keys(tables).length&&!sendCfg){setSyncStatus('ok');return}
    const j=await gasCall('push',{tables,config:sendCfg?cfg:null,summary:sendCfg&&D.siteInfo&&typeof siSummary==='function'?siSummary():undefined});
    let merged=false;if(j.tables&&typeof j.tables==='object'){syncNormalize(j.tables);Object.entries(j.tables).forEach(([e,rows])=>{if(!Array.isArray(rows)||!SCH[e])return;D[e]=rows;nh[e]=hashOf(JSON.stringify(D[e]));merged=true});LS.set(DKEY(),D)}
    Object.keys(tables).forEach(e=>{base[e]=rowMap(D[e])});LS.set(syncBaseKey(),base);if(merged&&j.tables&&Object.keys(j.tables).some(e=>!tables[e]||!tables[e].full))SYNC.onMerge&&SYNC.onMerge();
    if(j.url)LS.set('psd_ifm_siteurl_'+BIZK+'_'+gasSite(),j.url);
    LS.set(syncHashKey(),nh);setSyncStatus('ok')}
  catch(e){setSyncStatus('err',e.message)}finally{SYNC.busy=false;if(SYNC.again){SYNC.again=false;setTimeout(()=>syncPush(),300)}}}
function syncAfterSave(){if(!gasReady()||!gasCfg().auto||SYNC.pulling)return;clearTimeout(SYNC.t);SYNC.t=setTimeout(()=>syncPush(),2500)}
async function syncPull(){if(!gasReady())return false;SYNC.pulling=true;setSyncStatus('busy');
  try{const j=await gasCall('pull');if(j.url)LS.set('psd_ifm_siteurl_'+BIZK+'_'+gasSite(),j.url);
    if(j.empty){SYNC.pulling=false;if(typeof cap==='function'&&!cap('set')){setSyncStatus('err','Sheet ของอาคารนี้ยังว่าง — รอ Admin / FM ส่งข้อมูลตั้งต้น');return false}await syncPush(true);return false}
    const nd=Object.assign({},D,j.config||{},syncNormalize(j.tables||{}));nd._v=1;D=nd;ensureD();LS.set(DKEY(),D);
    const nh={},base={};SYNC_ENTS().forEach(e=>{nh[e]=hashOf(JSON.stringify(D[e]));base[e]=rowMap(D[e])});LS.set(syncBaseKey(),base);const cfg={};SYNC_CFG_KEYS.forEach(k=>{if(D[k]!==undefined)cfg[k]=D[k]});nh._cfg=hashOf(JSON.stringify(cfg));LS.set(syncHashKey(),nh);
    setSyncStatus('ok');return true}
  catch(e){setSyncStatus('err',e.message);return false}finally{SYNC.pulling=false}}
async function syncBoot(after){SYNC.after=after;if(!gasReady()||!gasCfg().auto){setSyncStatus(gasReady()?'manual':'off');return}const got=await syncPull();if(got&&after)after()}
/* periodic refresh: push local changes first, then pull what other devices saved */
async function syncRefresh(){if(!gasReady()||!gasCfg().auto||SYNC.busy||SYNC.pulling||document.hidden)return;if(SYNC.blockRefresh&&SYNC.blockRefresh())return;
  clearTimeout(SYNC.t);await syncPush();if(SYNC.status==='err')return;const before=hashOf(JSON.stringify(SYNC_ENTS().map(e=>D[e])));const got=await syncPull();
  if(got&&hashOf(JSON.stringify(SYNC_ENTS().map(e=>D[e])))!==before&&SYNC.after)SYNC.after()}
setInterval(syncRefresh,120000);
window.addEventListener('focus',()=>{if(SYNC.last&&Date.now()-SYNC.last.getTime()>30000)syncRefresh()});

    for(let i=16;i<64;i++){const a=W[i-15],b=W[i-2];W[i]=(W[i-16]+(r(a,7)^r(a,18)^(a>>>3))+W[i-7]+(r(b,17)^r(b,19)^(b>>>10)))|0}

    H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0}
